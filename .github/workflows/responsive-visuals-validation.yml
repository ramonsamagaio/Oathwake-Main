name: Responsive Visuals Validation

on:
  pull_request:
    paths:
      - "project.godot"
      - "data/monsters.json"
      - "data/buildings.json"
      - "data/sfx_profiles.json"
      - "data/sprites.json"
      - "data/animation_sets.json"
      - "data/characters.json"
      - "data/player_tuning.json"
      - "data/resources.json"
      - "data/vfx_profiles.json"
      - "assets/sprites/characters/**"
      - "assets/sprites/monsters/**"
      - "scenes/Player.tscn"
      - "scenes/game/Game.tscn"
      - "scenes/enemies/**"
      - "scenes/buildings/**"
      - "scenes/items/WorldItem.tscn"
      - "scenes/effects/**"
      - "scenes/ui/BuildMenuUI.tscn"
      - "scripts/enemies/**"
      - "scripts/player/PlayerWorldFeedbackSuite.gd"
      - "scripts/player/PlayerLifeAnimationSuite.gd"
      - "scripts/ResourceNode.gd"
      - "scripts/resources/**"
      - "scripts/maps/MapRoot.gd"
      - "scripts/npcs/NPC.gd"
      - "scripts/world/**"
      - "scripts/ui/FloatingCombatText*.gd"
      - "scripts/buildings/**"
      - "scripts/items/WorldItemFeedbackSuite.gd"
      - "scripts/effects/**"
      - "scripts/world/DayNightCycle.gd"
      - "scripts/BuildSystemLightingSuite.gd"
      - "scripts/CraftingSystem.gd"
      - "scripts/ui/BuildMenuUI.gd"
      - "scripts/test/ResponsiveVisualsValidator.gd"
      - "scripts/test/CharacterContentValidator.gd"
      - "scripts/test/WorldPresentationValidator.gd"
      - "scripts/test/PlayerVisualTuningValidator.gd"
      - "scripts/test/PlayerLifeAnimationValidator.gd"
      - "scripts/test/BuildCraftMonsterValidator.gd"
      - "tools/content_editor/ContentEditorLightingSuite.gd"
      - "tools/content_editor/ContentEditorPlayerVisualSuite.gd"
      - "tools/content_editor/ContentEditor.tscn"
      - "shaders/effects/**"
      - "shaders/gaussian_glow_screen.gdshader"
      - ".github/workflows/responsive-visuals-validation.yml"
      - ".github/workflows/nyra-fix-player-light-hit-text.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-focused-fixes:
    if: github.event.action == 'reopened' && github.head_ref == 'fix/player-light-attacks-hit-text'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/player-light-attacks-hit-text
      - name: Execute prepared patch
        shell: python
        run: |
          from pathlib import Path

          workflow_path = Path('.github/workflows/nyra-fix-player-light-hit-text.yml')
          text = workflow_path.read_text(encoding='utf-8')
          start_marker = '      - name: Apply focused fixes\n        shell: python\n        run: |\n'
          end_marker = '\n      - name: Commit focused fixes'
          if start_marker not in text or end_marker not in text:
              raise RuntimeError('Prepared patch block was not found')
          block = text.split(start_marker, 1)[1].split(end_marker, 1)[0]
          script_lines = []
          for line in block.splitlines():
              if line.startswith('          '):
                  script_lines.append(line[10:])
              else:
                  script_lines.append(line)
          script = '\n'.join(script_lines) + '\n'
          exec(compile(script, str(workflow_path), 'exec'), {'__name__': '__main__'})
      - name: Commit focused fixes
        run: |
          git config user.name "Nyra Automation"
          git config user.email "actions@users.noreply.github.com"
          git add data scenes scripts tools
          git commit -m "Expose player light tuning and fix hit text motion"
          git push origin HEAD:fix/player-light-attacks-hit-text

  validate:
    if: github.event.action != 'reopened' || github.head_ref != 'fix/player-light-attacks-hit-text'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install rendering dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb unzip libgl1-mesa-dri libglx-mesa0 mesa-utils

      - name: Download Godot 4.6.3
        run: |
          curl --fail --location --retry 4 --retry-delay 3 \
            --output godot.zip \
            https://github.com/godotengine/godot-builds/releases/download/4.6.3-stable/Godot_v4.6.3-stable_linux.x86_64.zip
          unzip -q godot.zip
          mv Godot_v4.6.3-stable_linux.x86_64 godot
          chmod +x godot
          ./godot --version

      - name: Import and compile project
        shell: bash
        run: |
          set -o pipefail
          xvfb-run -a ./godot \
            --editor \
            --path . \
            --rendering-method gl_compatibility \
            --display-driver x11 \
            --quit-after 240 \
            --verbose 2>&1 | tee import.log

      - name: Validate responsive visuals contracts
        shell: bash
        run: |
          set -o pipefail
          xvfb-run -a ./godot \
            --path . \
            --rendering-method gl_compatibility \
            --display-driver x11 \
            --script res://scripts/test/ResponsiveVisualsValidator.gd \
            --verbose 2>&1 | tee validator.log

      - name: Validate character content records
        shell: bash
        run: |
          set -o pipefail
          xvfb-run -a ./godot \
            --path . \
            --rendering-method gl_compatibility \
            --display-driver x11 \
            --script res://scripts/test/CharacterContentValidator.gd \
            --verbose 2>&1 | tee character-content-validator.log

      - name: Validate player visual tuning
        shell: bash
        run: |
          set -o pipefail
          xvfb-run -a ./godot \
            --path . \
            --rendering-method gl_compatibility \
            --display-driver x11 \
            --script res://scripts/test/PlayerVisualTuningValidator.gd \
            --verbose 2>&1 | tee player-visual-validator.log

      - name: Validate player hurt and death animations
        shell: bash
        run: |
          set -o pipefail
          xvfb-run -a ./godot \
            --path . \
            --rendering-method gl_compatibility \
            --display-driver x11 \
            --script res://scripts/test/PlayerLifeAnimationValidator.gd \
            --verbose 2>&1 | tee player-life-animation-validator.log

      - name: Validate build craft door lights and monsters
        shell: bash
        run: |
          set -o pipefail
          xvfb-run -a ./godot \
            --path . \
            --rendering-method gl_compatibility \
            --display-driver x11 \
            --script res://scripts/test/BuildCraftMonsterValidator.gd \
            --verbose 2>&1 | tee build-craft-monster-validator.log

      - name: Validate world depth shadows hit motion and attack variety
        shell: bash
        run: |
          set -o pipefail
          xvfb-run -a ./godot \
            --path . \
            --rendering-method gl_compatibility \
            --display-driver x11 \
            --script res://scripts/test/WorldPresentationValidator.gd \
            --verbose 2>&1 | tee world-presentation-validator.log

      - name: Open intro at base resolution
        shell: bash
        run: |
          set -o pipefail
          xvfb-run -a ./godot \
            --path . \
            --rendering-method gl_compatibility \
            --display-driver x11 \
            --resolution 1600x900 \
            --quit-after 120 \
            res://scenes/ui/IntroScreen.tscn \
            --verbose 2>&1 | tee intro-base.log

      - name: Open game at maximized-like resolution
        shell: bash
        run: |
          set -o pipefail
          xvfb-run -a ./godot \
            --path . \
            --rendering-method gl_compatibility \
            --display-driver x11 \
            --resolution 2048x1152 \
            --quit-after 180 \
            res://scenes/game/Game.tscn \
            --verbose 2>&1 | tee game-large.log

      - name: Reject parser shader and renderer regressions
        shell: bash
        run: |
          if grep -E -i \
            'Parse Error|SCRIPT ERROR|Shader compilation failed|Parameter "version" is null|Using .return. in the .(vertex|fragment). processor' \
            import.log validator.log character-content-validator.log player-visual-validator.log player-life-animation-validator.log build-craft-monster-validator.log world-presentation-validator.log intro-base.log game-large.log; then
            exit 1
          fi

      - name: Upload validation logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: responsive-visuals-validation
          path: |
            import.log
            validator.log
            character-content-validator.log
            player-visual-validator.log
            player-life-animation-validator.log
            build-craft-monster-validator.log
            world-presentation-validator.log
            intro-base.log
            game-large.log
          if-no-files-found: warn
