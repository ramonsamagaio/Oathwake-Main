name: Responsive Visuals Validation

on:
  pull_request:
    paths:
      - "project.godot"
      - "data/monsters.json"
      - "data/buildings.json"
      - "data/sfx_profiles.json"
      - "scenes/Player.tscn"
      - "scenes/game/Game.tscn"
      - "scenes/enemies/**"
      - "scenes/buildings/**"
      - "scenes/items/WorldItem.tscn"
      - "scenes/effects/**"
      - "scenes/ui/BuildMenuUI.tscn"
      - "scripts/enemies/**"
      - "scripts/buildings/**"
      - "scripts/items/WorldItemFeedbackSuite.gd"
      - "scripts/effects/**"
      - "scripts/world/DayNightCycle.gd"
      - "scripts/BuildSystemLightingSuite.gd"
      - "scripts/ui/BuildMenuUI.gd"
      - "scripts/test/ResponsiveVisualsValidator.gd"
      - "tools/content_editor/ContentEditorLightingSuite.gd"
      - "tools/content_editor/ContentEditor.tscn"
      - "shaders/effects/**"
      - "shaders/gaussian_glow_screen.gdshader"
      - ".github/workflows/responsive-visuals-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install rendering dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb unzip libgl1-mesa-dri libglx-mesa0 mesa-utils

      - name: Download Godot 4.6.3
        run: |
          curl --fail --location --retry 4 --retry-delay 3 \
            --output godot.zip \
            https://github.com/godotengine/godot-builds/releases/download/4.6.3-stable/Godot_v4.6.3-stable_linux.x86_64.zip
          unzip -q godot.zip
          mv Godot_v4.6.3-stable_linux.x86_64 godot
          chmod +x godot
          ./godot --version

      - name: Import and compile project
        shell: bash
        run: |
          set -o pipefail
          xvfb-run -a ./godot \
            --editor \
            --path . \
            --rendering-method gl_compatibility \
            --display-driver x11 \
            --quit-after 240 \
            --verbose 2>&1 | tee import.log

      - name: Validate responsive visuals contracts
        shell: bash
        run: |
          set -o pipefail
          xvfb-run -a ./godot \
            --path . \
            --rendering-method gl_compatibility \
            --display-driver x11 \
            --script res://scripts/test/ResponsiveVisualsValidator.gd \
            --verbose 2>&1 | tee validator.log

      - name: Open intro at base resolution
        shell: bash
        run: |
          set -o pipefail
          xvfb-run -a ./godot \
            --path . \
            --rendering-method gl_compatibility \
            --display-driver x11 \
            --resolution 1600x900 \
            --quit-after 120 \
            res://scenes/ui/IntroScreen.tscn \
            --verbose 2>&1 | tee intro-base.log

      - name: Open game at maximized-like resolution
        shell: bash
        run: |
          set -o pipefail
          xvfb-run -a ./godot \
            --path . \
            --rendering-method gl_compatibility \
            --display-driver x11 \
            --resolution 2048x1152 \
            --quit-after 180 \
            res://scenes/game/Game.tscn \
            --verbose 2>&1 | tee game-large.log

      - name: Reject parser shader and renderer regressions
        shell: bash
        run: |
          if grep -E -i \
            'Parse Error|SCRIPT ERROR|Shader compilation failed|Parameter "version" is null|Using .return. in the .(vertex|fragment). processor' \
            import.log validator.log intro-base.log game-large.log; then
            exit 1
          fi

      - name: Upload validation logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: responsive-visuals-validation
          path: |
            import.log
            validator.log
            intro-base.log
            game-large.log
          if-no-files-found: warn
