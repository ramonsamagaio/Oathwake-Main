name: Responsive Visuals Validation

on:
  pull_request:
    paths:
      - "project.godot"
      - "data/monsters.json"
      - "data/buildings.json"
      - "data/sfx_profiles.json"
      - "data/sprites.json"
      - "data/animation_sets.json"
      - "data/characters.json"
      - "data/player_tuning.json"
      - "data/resources.json"
      - "data/vfx_profiles.json"
      - "assets/sprites/characters/**"
      - "assets/sprites/monsters/**"
      - "scenes/Player.tscn"
      - "scenes/game/Game.tscn"
      - "scenes/maps/**"
      - "scenes/enemies/**"
      - "scenes/buildings/**"
      - "scenes/items/WorldItem.tscn"
      - "scenes/effects/**"
      - "scenes/ui/BuildMenuUI.tscn"
      - "scripts/enemies/**"
      - "scripts/player/PlayerWorldFeedbackSuite.gd"
      - "scripts/player/PlayerLifeAnimationSuite.gd"
      - "scripts/ResourceNode.gd"
      - "scripts/resources/**"
      - "scripts/maps/MapRoot.gd"
      - "scripts/npcs/NPC.gd"
      - "scripts/world/**"
      - "scripts/ui/FloatingCombatText*.gd"
      - "scripts/ui/RuntimeContentEditorButton.gd"
      - "scripts/buildings/**"
      - "scripts/items/WorldItemFeedbackSuite.gd"
      - "scripts/effects/**"
      - "scripts/world/DayNightCycle.gd"
      - "scripts/BuildSystemLightingSuite.gd"
      - "scripts/CraftingSystem.gd"
      - "scripts/ui/BuildMenuUI.gd"
      - "scripts/test/ResponsiveVisualsValidator.gd"
      - "scripts/test/CharacterContentValidator.gd"
      - "scripts/test/WorldPresentationValidator.gd"
      - "scripts/test/ProjectedShadowFrameValidator.gd"
      - "scripts/test/DynamicShadowCycleValidator.gd"
      - "scripts/test/WorldAtmosphereValidator.gd"
      - "scripts/test/WorldPostProcessingValidator.gd"
      - "scripts/test/WorldEnvironmentEffectsValidator.gd"
      - "scripts/test/RuntimeContentEditorLightValidator.gd"
      - "scripts/test/PlayerVisualTuningValidator.gd"
      - "scripts/test/PlayerLifeAnimationValidator.gd"
      - "scripts/test/BuildCraftMonsterValidator.gd"
      - "tools/content_editor/ContentEditorLightingSuite.gd"
      - "tools/content_editor/ContentEditorPlayerVisualSuite.gd"
      - "tools/content_editor/ContentEditorPostProcessSuite.gd"
      - "tools/content_editor/ContentEditorEnvironmentSuite.gd"
      - "tools/content_editor/ContentEditor.tscn"
      - "shaders/**"
      - ".github/workflows/responsive-visuals-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install rendering dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb unzip libgl1-mesa-dri libglx-mesa0 mesa-utils

      - name: Download Godot 4.6.3
        run: |
          curl --fail --location --retry 4 --retry-delay 3 \
            --output godot.zip \
            https://github.com/godotengine/godot-builds/releases/download/4.6.3-stable/Godot_v4.6.3-stable_linux.x86_64.zip
          unzip -q godot.zip
          mv Godot_v4.6.3-stable_linux.x86_64 godot
          chmod +x godot
          ./godot --version

      - name: Import and compile project
        shell: bash
        run: |
          set -o pipefail
          xvfb-run -a ./godot \
            --editor \
            --path . \
            --rendering-method gl_compatibility \
            --display-driver x11 \
            --quit-after 240 \
            --verbose 2>&1 | tee import.log

      - name: Validate responsive visuals contracts
        shell: bash
        run: |
          set -o pipefail
          xvfb-run -a ./godot \
            --path . \
            --rendering-method gl_compatibility \
            --display-driver x11 \
            --script res://scripts/test/ResponsiveVisualsValidator.gd \
            --verbose 2>&1 | tee validator.log

      - name: Validate character content records
        shell: bash
        run: |
          set -o pipefail
          xvfb-run -a ./godot \
            --path . \
            --rendering-method gl_compatibility \
            --display-driver x11 \
            --script res://scripts/test/CharacterContentValidator.gd \
            --verbose 2>&1 | tee character-content-validator.log

      - name: Validate player visual tuning
        shell: bash
        run: |
          set -o pipefail
          xvfb-run -a ./godot \
            --path . \
            --rendering-method gl_compatibility \
            --display-driver x11 \
            --script res://scripts/test/PlayerVisualTuningValidator.gd \
            --verbose 2>&1 | tee player-visual-validator.log

      - name: Validate runtime Content Editor and night-only player light
        shell: bash
        run: |
          set -o pipefail
          xvfb-run -a ./godot \
            --path . \
            --rendering-method gl_compatibility \
            --display-driver x11 \
            --script res://scripts/test/RuntimeContentEditorLightValidator.gd \
            --verbose 2>&1 | tee runtime-content-editor-light-validator.log

      - name: Validate player hurt and death animations
        shell: bash
        run: |
          set -o pipefail
          xvfb-run -a ./godot \
            --path . \
            --rendering-method gl_compatibility \
            --display-driver x11 \
            --script res://scripts/test/PlayerLifeAnimationValidator.gd \
            --verbose 2>&1 | tee player-life-animation-validator.log

      - name: Validate build craft door lights and monsters
        shell: bash
        run: |
          set -o pipefail
          xvfb-run -a ./godot \
            --path . \
            --rendering-method gl_compatibility \
            --display-driver x11 \
            --script res://scripts/test/BuildCraftMonsterValidator.gd \
            --verbose 2>&1 | tee build-craft-monster-validator.log

      - name: Validate world depth shadows hit motion and attack variety
        shell: bash
        run: |
          set -o pipefail
          xvfb-run -a ./godot \
            --path . \
            --rendering-method gl_compatibility \
            --display-driver x11 \
            --script res://scripts/test/WorldPresentationValidator.gd \
            --verbose 2>&1 | tee world-presentation-validator.log

      - name: Validate active-frame projected shadow silhouettes
        shell: bash
        run: |
          set -o pipefail
          xvfb-run -a ./godot \
            --path . \
            --rendering-method gl_compatibility \
            --display-driver x11 \
            --script res://scripts/test/ProjectedShadowFrameValidator.gd \
            --verbose 2>&1 | tee projected-shadow-frame-validator.log

      - name: Validate rigid solar rotation and night light shadows
        shell: bash
        run: |
          set -o pipefail
          xvfb-run -a ./godot \
            --path . \
            --rendering-method gl_compatibility \
            --display-driver x11 \
            --script res://scripts/test/DynamicShadowCycleValidator.gd \
            --verbose 2>&1 | tee dynamic-shadow-cycle-validator.log

      - name: Validate occlusion shared wind and biome ambience
        shell: bash
        run: |
          set -o pipefail
          xvfb-run -a ./godot \
            --path . \
            --rendering-method gl_compatibility \
            --display-driver x11 \
            --script res://scripts/test/WorldAtmosphereValidator.gd \
            --verbose 2>&1 | tee world-atmosphere-validator.log

      - name: Validate selective bloom grading and night contrast
        shell: bash
        run: |
          set -o pipefail
          xvfb-run -a ./godot \
            --path . \
            --rendering-method gl_compatibility \
            --display-driver x11 \
            --script res://scripts/test/WorldPostProcessingValidator.gd \
            --verbose 2>&1 | tee world-post-processing-validator.log

      - name: Validate fog water shafts and environmental motion
        shell: bash
        run: |
          set -o pipefail
          xvfb-run -a ./godot \
            --path . \
            --rendering-method gl_compatibility \
            --display-driver x11 \
            --script res://scripts/test/WorldEnvironmentEffectsValidator.gd \
            --verbose 2>&1 | tee world-environment-effects-validator.log

      - name: Open intro at base resolution
        shell: bash
        run: |
          set -o pipefail
          xvfb-run -a ./godot \
            --path . \
            --rendering-method gl_compatibility \
            --display-driver x11 \
            --resolution 1600x900 \
            --quit-after 120 \
            res://scenes/ui/IntroScreen.tscn \
            --verbose 2>&1 | tee intro-base.log

      - name: Open game at maximized-like resolution
        shell: bash
        run: |
          set -o pipefail
          xvfb-run -a ./godot \
            --path . \
            --rendering-method gl_compatibility \
            --display-driver x11 \
            --resolution 2048x1152 \
            --quit-after 180 \
            res://scenes/game/Game.tscn \
            --verbose 2>&1 | tee game-large.log

      - name: Reject parser shader and renderer regressions
        shell: bash
        run: |
          if grep -E -i \
            'Parse Error|SCRIPT ERROR|Shader compilation failed|Parameter "version" is null|Using .return. in the .(vertex|fragment). processor' \
            import.log validator.log character-content-validator.log player-visual-validator.log runtime-content-editor-light-validator.log player-life-animation-validator.log build-craft-monster-validator.log world-presentation-validator.log projected-shadow-frame-validator.log dynamic-shadow-cycle-validator.log world-atmosphere-validator.log world-post-processing-validator.log world-environment-effects-validator.log intro-base.log game-large.log; then
            exit 1
          fi

      - name: Upload validation logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: responsive-visuals-validation
          path: |
            import.log
            validator.log
            character-content-validator.log
            player-visual-validator.log
            runtime-content-editor-light-validator.log
            player-life-animation-validator.log
            build-craft-monster-validator.log
            world-presentation-validator.log
            projected-shadow-frame-validator.log
            dynamic-shadow-cycle-validator.log
            world-atmosphere-validator.log
            world-post-processing-validator.log
            world-environment-effects-validator.log
            intro-base.log
            game-large.log
          if-no-files-found: warn
