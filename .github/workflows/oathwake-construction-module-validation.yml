name: Oathwake Construction Module Validation

on:
  push:
    branches:
      - fix/alabaster-final-retarget-polish
    paths:
      - 'data/world/construction_module.json'
      - 'data/buildings.json'
      - 'data/player_tuning.json'
      - 'data/characters.json'
      - 'scenes/Player.tscn'
      - 'scripts/BuildSystem.gd'
      - 'scripts/buildings/Building.gd'
      - 'scripts/labs/romestead_systems/RomesteadBiomeWorld2D.gd'
      - 'scripts/test/OathwakeConstructionModuleValidator.gd'
      - 'scripts/test/OathwakeCharacterScaleProbe.gd'
      - 'assets/sprites/world/procedural/**'
      - 'assets/sprites/tilesets/PROPS_FARM/house_medieval_01_512x512.png'
      - '.github/workflows/oathwake-construction-module-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot 4.6.3
        shell: bash
        run: |
          curl --fail --location --retry 3 \
            "https://github.com/godotengine/godot-builds/releases/download/4.6.3-stable/Godot_v4.6.3-stable_linux.x86_64.zip" \
            --output godot.zip >/dev/null 2>&1
          unzip -q godot.zip
          mv Godot_v4.6.3-stable_linux.x86_64 godot
          chmod +x godot
      - name: Import project
        shell: bash
        run: |
          ./godot --headless --editor --path . --quit-after 1 > /tmp/oathwake-construction-import.log 2>&1 || {
            tail -400 /tmp/oathwake-construction-import.log
            exit 1
          }
      - name: Measure live player scale
        shell: bash
        run: |
          ./godot --headless --path . --script res://scripts/test/OathwakeCharacterScaleProbe.gd > /tmp/oathwake-character-scale.log 2>&1 || {
            cat /tmp/oathwake-character-scale.log
            exit 1
          }
          cat /tmp/oathwake-character-scale.log
          grep -F 'OATHWAKE_CHARACTER_SCALE_PROBE_OK' /tmp/oathwake-character-scale.log
      - name: Validate construction module
        shell: bash
        run: |
          ./godot --headless --path . --script res://scripts/test/OathwakeConstructionModuleValidator.gd > /tmp/oathwake-construction.log 2>&1 || {
            cat /tmp/oathwake-construction.log
            exit 1
          }
          cat /tmp/oathwake-construction.log
          grep -F 'OATHWAKE_CONSTRUCTION_AUDIT_OK' /tmp/oathwake-construction.log
