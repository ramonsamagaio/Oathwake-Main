name: Nyra Apply Gameplay Patch V2

on:
  push:
    branches:
      - feature/build-craft-door-monsters-v2
    paths:
      - ".github/nyra/build-craft-monsters-v2.b64"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/build-craft-door-monsters-v2
      - name: Extract prepared files
        run: |
          base64 --decode .github/nyra/build-craft-monsters-v2.b64 > /tmp/changes.tar.gz
          tar -xzf /tmp/changes.tar.gz
          rm .github/nyra/build-craft-monsters-v2.b64
      - name: Commit gameplay systems
        run: |
          git config user.name "Nyra Automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Add build door lighting and new monster visuals"
          git push origin HEAD:feature/build-craft-door-monsters-v2
