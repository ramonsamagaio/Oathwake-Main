name: Nyra Apply Gameplay Patch V2

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/nyra-gameplay-audit-v2.yml"
      - ".github/nyra/build-craft-monsters-v2.b64"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/build-craft-door-monsters-v2
      - name: Extract prepared files
        shell: python
        run: |
          from pathlib import Path
          import base64, tarfile

          payload_path = Path('.github/nyra/build-craft-monsters-v2.b64')
          payload = ''.join(payload_path.read_text(encoding='utf-8').split())
          print(f'payload_chars={len(payload)}')
          archive_path = Path('/tmp/changes.tar.gz')
          archive_path.write_bytes(base64.b64decode(payload, validate=True))
          print(f'archive_bytes={archive_path.stat().st_size}')
          with tarfile.open(archive_path, 'r:gz') as archive:
              archive.extractall('.')
          payload_path.unlink()
      - name: Commit gameplay systems
        run: |
          git config user.name "Nyra Automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Add build door lighting and new monster visuals"
          git push origin HEAD:feature/build-craft-door-monsters-v2
