name: Nyra Apply Gameplay Patch V2

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/nyra-gameplay-audit-v2.yml"
      - ".github/nyra/build-craft-monsters-v2.part*"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/build-craft-door-monsters-v2
      - name: Extract prepared files
        shell: python
        run: |
          from pathlib import Path
          import base64, hashlib, tarfile

          chunk_paths = sorted(Path('.github/nyra').glob('build-craft-monsters-v2.part*'))
          if len(chunk_paths) != 7:
              raise RuntimeError(f'Expected 7 chunks, found {len(chunk_paths)}')
          payload = ''.join(path.read_text(encoding='utf-8') for path in chunk_paths)
          if hashlib.sha256(payload.encode()).hexdigest() != '421646902b28eeff101e55d430a59a925840a303128feaf6f3ebc310140112d1':
              raise RuntimeError('Gameplay payload text hash mismatch')
          archive_bytes = base64.b64decode(payload, validate=True)
          if hashlib.sha256(archive_bytes).hexdigest() != '2a43ebef4c7695650b82f989c84f56930d51d8c0e4a5d7ad6d0b112e5b962ba8':
              raise RuntimeError('Gameplay archive hash mismatch')
          archive_path = Path('/tmp/changes.tar.gz')
          archive_path.write_bytes(archive_bytes)
          with tarfile.open(archive_path, 'r:gz') as archive:
              archive.extractall('.')
          Path('.github/workflows/responsive-visuals-validation.yml').unlink(missing_ok=True)
          for path in chunk_paths:
              path.unlink()
          Path('.github/nyra/build-craft-monsters-v2.b64').unlink(missing_ok=True)
      - name: Commit gameplay systems
        run: |
          git config user.name "Nyra Automation"
          git config user.email "actions@users.noreply.github.com"
          git checkout HEAD -- .github/workflows/responsive-visuals-validation.yml
          git add data scenes scripts .github/nyra
          git commit -m "Add build door lighting and new monster visuals"
          git push origin HEAD:feature/build-craft-door-monsters-v2
