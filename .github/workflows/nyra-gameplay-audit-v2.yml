name: Nyra Gameplay Audit V2

on:
  push:
    branches:
      - feature/build-craft-door-monsters-v2
    paths:
      - ".github/workflows/nyra-gameplay-audit-v2.yml"

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package repository
        run: |
          zip -qr oathwake-gameplay-audit-v2.zip . \
            -x '.git/*' '.godot/*' 'oathwake-gameplay-audit-v2.zip'
      - uses: actions/upload-artifact@v4
        with:
          name: oathwake-gameplay-audit-v2
          path: oathwake-gameplay-audit-v2.zip
          if-no-files-found: error
