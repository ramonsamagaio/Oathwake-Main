name: Organize procedural world sprites

on:
  push:
    branches:
      - feature/procedural-terrain-grass-v1
    paths:
      - .github/workflows/organize_procedural_sprites.yml

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: feature/procedural-terrain-grass-v1
          fetch-depth: 0

      - name: Move visual assets and validate references
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from __future__ import annotations
          import hashlib
          import json
          import re
          import struct
          from pathlib import Path

          repo = Path('.')
          old_base = Path('assets/world_lab/romestead_native_png/sources')
          new_base = Path('assets/sprites/world/procedural')

          groups = {
              'terrain': {
                  'old_dir': 'floors',
                  'files': [
                      'plainsgrass2.png',
                      'short_grass.png',
                      'plainsgrass3.png',
                      'plainsgrass1.png',
                      'tall_grass.png',
                      'forest_path_short_grass_autumn.png',
                      'forest_unbreakable_bushes_bottom_.png',
                      'forest_unbreakable_bushes_top_.png',
                      'tree_wall.png',
                      'canopy_.png',
                      'plains_3D_cliffs.png',
                      'plainsgrass2_details.png',
                      'shortgrass_details.png',
                      'plainsgrass3_details.png',
                  ],
              },
              'trees': {
                  'old_dir': 'props',
                  'files': [
                      'flora_stump.png',
                      'flora_tree1.png',
                      'flora_tree2.png',
                      'flora_olive_tree_large.png',
                      'flora_olive_tree_stump.png',
                      'flora_skinny_tree.png',
                      'flora_tall_cypress.png',
                      'flora_apple_tree_large.png',
                      'flora_apple_tree_stump.png',
                      'flora_stone_pine_large.png',
                      'flora_stone_pine_stump.png',
                  ],
              },
              'rocks': {
                  'old_dir': 'props',
                  'files': [
                      'terrain_round_rocks_big.png',
                      'terrain_round_rocks_small.png',
                      'poi_mossy_boulder_large.png',
                      'resources_copper_ore.png',
                  ],
              },
              'plants': {
                  'old_dir': 'props',
                  'files': [
                      'flora_big_bushes1.png',
                      'flora_small_bush1.png',
                      'desert_purplebush.png',
                      'flora_ground_plants.png',
                      'flora_wheat_animated.png',
                      'flora_mushrooms.png',
                      'flora_bellflowers.png',
                      'flora_lilies.png',
                      'flora_tiny_flowers.png',
                      'flora_tiny_ground_leaves.png',
                  ],
              },
              'objects': {
                  'old_dir': 'props',
                  'files': ['tier0_brazier.png'],
              },
              'wildlife': {
                  'old_dir': 'wildlife',
                  'files': [
                      'squirrel_squirrel_idle.png',
                      'squirrel_squirrel_running.png',
                      'squirrel_squirrel_feeding.png',
                      'rabbit_rabbit_idle.png',
                      'rabbit_rabbit_run.png',
                      'deer_deer_female_idle.png',
                      'deer_deer_female_walk.png',
                      'deer_deer_female_run.png',
                      'deer_deer_female_alert.png',
                      'deer_deer_female_alert_loop.png',
                      'bird_idle.png',
                      'bird_hop.png',
                      'bird_peck.png',
                      'bird_fly.png',
                  ],
              },
          }

          mapping: dict[Path, Path] = {}
          for category, info in groups.items():
              for filename in info['files']:
                  src = old_base / info['old_dir'] / filename
                  dst = new_base / category / filename
                  if src in mapping:
                      raise SystemExit(f'duplicate source in manifest: {src}')
                  mapping[src] = dst

          if len(mapping) != 54:
              raise SystemExit(f'manifest must contain exactly 54 PNGs, got {len(mapping)}')
          if len(set(mapping.values())) != 54:
              raise SystemExit('destination manifest contains duplicate paths')

          def sha256(path: Path) -> str:
              h = hashlib.sha256()
              with path.open('rb') as f:
                  for chunk in iter(lambda: f.read(1024 * 1024), b''):
                      h.update(chunk)
              return h.hexdigest()

          def png_size(path: Path) -> tuple[int, int]:
              with path.open('rb') as f:
                  sig = f.read(24)
              if len(sig) < 24 or sig[:8] != b'\x89PNG\r\n\x1a\n' or sig[12:16] != b'IHDR':
                  raise SystemExit(f'not a valid PNG: {path}')
              return struct.unpack('>II', sig[16:24])

          # PRE-FLIGHT 1: every source PNG and Godot import sidecar must exist.
          missing = []
          collisions = []
          before_hashes = {}
          before_uids = {}
          before_sizes = {}
          for src, dst in mapping.items():
              sidecar = Path(str(src) + '.import')
              if not src.is_file():
                  missing.append(str(src))
              if not sidecar.is_file():
                  missing.append(str(sidecar))
              if dst.exists() or Path(str(dst) + '.import').exists():
                  collisions.append(str(dst))
              if src.is_file():
                  before_hashes[src] = sha256(src)
                  before_sizes[src] = png_size(src)
              if sidecar.is_file():
                  text = sidecar.read_text(encoding='utf-8')
                  m = re.search(r'^uid="([^"]+)"', text, re.MULTILINE)
                  if not m:
                      raise SystemExit(f'Godot import sidecar has no UID: {sidecar}')
                  before_uids[src] = m.group(1)
          if missing:
              raise SystemExit('pre-flight missing files:\n' + '\n'.join(missing))
          if collisions:
              raise SystemExit('pre-flight destination collisions:\n' + '\n'.join(collisions))
          if len(set(before_uids.values())) != len(before_uids):
              raise SystemExit('duplicate Godot UID found among the 54 visual assets')

          # PRE-FLIGHT 2: collect all text references before moving, so the migration
          # can prove that every old direct reference was replaced rather than guessed.
          tracked = [Path(p) for p in __import__('subprocess').check_output(['git', 'ls-files'], text=True).splitlines()]
          direct_old_refs = {src: [] for src in mapping}
          for path in tracked:
              if not path.is_file():
                  continue
              try:
                  text = path.read_text(encoding='utf-8')
              except (UnicodeDecodeError, OSError):
                  continue
              for src in mapping:
                  token = 'res://' + src.as_posix()
                  if token in text:
                      direct_old_refs[src].append(path.as_posix())

          # MOVE: git mv preserves history. Sidecars travel with their PNGs to keep
          # UIDs/import parameters stable. Image bytes are never rewritten.
          import subprocess
          for category in groups:
              (new_base / category).mkdir(parents=True, exist_ok=True)
          for src, dst in mapping.items():
              subprocess.run(['git', 'mv', src.as_posix(), dst.as_posix()], check=True)
              subprocess.run(['git', 'mv', (str(src) + '.import'), (str(dst) + '.import')], check=True)

          # REFERENCE MIGRATION: replace every literal res:// old path in every tracked
          # UTF-8 file, including .import source_file metadata.
          replacements = {
              'res://' + src.as_posix(): 'res://' + dst.as_posix()
              for src, dst in mapping.items()
          }
          tracked_after_move = [Path(p) for p in subprocess.check_output(['git', 'ls-files'], text=True).splitlines()]
          for path in tracked_after_move:
              if not path.is_file():
                  continue
              try:
                  text = path.read_text(encoding='utf-8')
              except (UnicodeDecodeError, OSError):
                  continue
              new_text = text
              for old, new in replacements.items():
                  new_text = new_text.replace(old, new)
              if new_text != text:
                  path.write_text(new_text, encoding='utf-8')

          # RomesteadBiomeWorld2D intentionally used a shared EDITABLE_ROOT expression,
          # so its paths are assembled rather than stored as direct strings. Convert
          # those 40-ish expressions to explicit category roots, then remove the stale
          # external-source root entirely.
          biome_script = Path('scripts/labs/romestead_systems/RomesteadBiomeWorld2D.gd')
          script = biome_script.read_text(encoding='utf-8')
          old_root_decl = 'const EDITABLE_ROOT := "res://assets/world_lab/romestead_native_png/sources"\n'
          new_root_decl = (
              'const PROCEDURAL_SPRITE_ROOT := "res://assets/sprites/world/procedural"\n'
              'const TERRAIN_SPRITE_ROOT := PROCEDURAL_SPRITE_ROOT + "/terrain"\n'
              'const TREE_SPRITE_ROOT := PROCEDURAL_SPRITE_ROOT + "/trees"\n'
              'const ROCK_SPRITE_ROOT := PROCEDURAL_SPRITE_ROOT + "/rocks"\n'
              'const PLANT_SPRITE_ROOT := PROCEDURAL_SPRITE_ROOT + "/plants"\n'
              'const OBJECT_SPRITE_ROOT := PROCEDURAL_SPRITE_ROOT + "/objects"\n'
          )
          if old_root_decl not in script:
              raise SystemExit('expected EDITABLE_ROOT declaration not found; aborting instead of guessing')
          script = script.replace(old_root_decl, new_root_decl, 1)
          root_for_category = {
              'terrain': 'TERRAIN_SPRITE_ROOT',
              'trees': 'TREE_SPRITE_ROOT',
              'rocks': 'ROCK_SPRITE_ROOT',
              'plants': 'PLANT_SPRITE_ROOT',
              'objects': 'OBJECT_SPRITE_ROOT',
          }
          for category, info in groups.items():
              if category == 'wildlife':
                  continue
              root_name = root_for_category[category]
              for filename in info['files']:
                  old_expr = f'EDITABLE_ROOT + "/{info["old_dir"]}/{filename}"'
                  new_expr = f'{root_name} + "/{filename}"'
                  if old_expr not in script:
                      raise SystemExit(f'expected generated-path expression not found: {old_expr}')
                  script = script.replace(old_expr, new_expr)
          if 'EDITABLE_ROOT' in script:
              raise SystemExit('stale EDITABLE_ROOT remains after targeted migration')
          biome_script.write_text(script, encoding='utf-8')

          # POST-FLIGHT 1: binary identity + dimensions + Godot UIDs must be unchanged.
          for src, dst in mapping.items():
              if not dst.is_file():
                  raise SystemExit(f'moved PNG missing: {dst}')
              sidecar = Path(str(dst) + '.import')
              if not sidecar.is_file():
                  raise SystemExit(f'moved import sidecar missing: {sidecar}')
              if sha256(dst) != before_hashes[src]:
                  raise SystemExit(f'PNG bytes changed during move: {src} -> {dst}')
              if png_size(dst) != before_sizes[src]:
                  raise SystemExit(f'PNG dimensions changed during move: {src} -> {dst}')
              text = sidecar.read_text(encoding='utf-8')
              uid_match = re.search(r'^uid="([^"]+)"', text, re.MULTILINE)
              if not uid_match or uid_match.group(1) != before_uids[src]:
                  raise SystemExit(f'Godot UID changed during move: {src} -> {dst}')
              expected_source = 'source_file="res://' + dst.as_posix() + '"'
              if expected_source not in text:
                  raise SystemExit(f'.import source_file not migrated: {sidecar}')

          # POST-FLIGHT 2: no old reference for any of the 54 moved images may remain.
          stale = []
          for path in [Path(p) for p in subprocess.check_output(['git', 'ls-files'], text=True).splitlines()]:
              if not path.is_file():
                  continue
              try:
                  text = path.read_text(encoding='utf-8')
              except (UnicodeDecodeError, OSError):
                  continue
              for old in replacements:
                  if old in text:
                      stale.append(f'{path}: {old}')
          if stale:
              raise SystemExit('stale moved-asset references remain:\n' + '\n'.join(stale))

          # POST-FLIGHT 3: every new procedural-world PNG reference must resolve.
          broken_new_refs = []
          new_ref_re = re.compile(r'res://assets/sprites/world/procedural/[A-Za-z0-9_./-]+\.png')
          for path in [Path(p) for p in subprocess.check_output(['git', 'ls-files'], text=True).splitlines()]:
              if not path.is_file():
                  continue
              try:
                  text = path.read_text(encoding='utf-8')
              except (UnicodeDecodeError, OSError):
                  continue
              for ref in set(new_ref_re.findall(text)):
                  disk = Path(ref.removeprefix('res://'))
                  if not disk.is_file():
                      broken_new_refs.append(f'{path}: {ref}')
          if broken_new_refs:
              raise SystemExit('new procedural sprite references do not resolve:\n' + '\n'.join(broken_new_refs))

          # POST-FLIGHT 4: validate ContentDB JSON and every SpriteDB region that points
          # at a moved texture. This catches a path that resolves but whose atlas region
          # is outside the original PNG canvas.
          for json_path in Path('data').glob('*.json'):
              try:
                  json.loads(json_path.read_text(encoding='utf-8'))
              except Exception as exc:
                  raise SystemExit(f'invalid JSON after migration: {json_path}: {exc}')

          sprites = json.loads(Path('data/sprites.json').read_text(encoding='utf-8'))
          for sprite_id, entry in sprites.items():
              ref = str(entry.get('texture_path', ''))
              if not ref.startswith('res://assets/sprites/world/procedural/'):
                  continue
              img = Path(ref.removeprefix('res://'))
              if not img.is_file():
                  raise SystemExit(f'sprite {sprite_id} points to missing moved texture: {ref}')
              width, height = png_size(img)
              region = entry.get('region', {})
              if entry.get('region_enabled', False) and isinstance(region, dict):
                  x = int(region.get('x', 0)); y = int(region.get('y', 0))
                  w = int(region.get('w', 0)); h = int(region.get('h', 0))
                  if x < 0 or y < 0 or w <= 0 or h <= 0 or x + w > width or y + h > height:
                      raise SystemExit(
                          f'sprite region outside moved atlas: {sprite_id} {region} vs {width}x{height} ({ref})'
                      )

          # Wildlife animations are not SpriteDB regions, so validate their sheet grids too.
          monsters = json.loads(Path('data/monsters.json').read_text(encoding='utf-8'))
          for monster_id, monster in monsters.items():
              animations = monster.get('animations', {})
              if not isinstance(animations, dict):
                  continue
              for anim_name, anim in animations.items():
                  if not isinstance(anim, dict):
                      continue
                  ref = str(anim.get('texture_path', ''))
                  if not ref.startswith('res://assets/sprites/world/procedural/wildlife/'):
                      continue
                  img = Path(ref.removeprefix('res://'))
                  width, height = png_size(img)
                  fw = int(anim.get('frame_width', 0)); fh = int(anim.get('frame_height', 0))
                  frames = int(anim.get('frames', 1)); start = int(anim.get('frame_start', 0)); row = int(anim.get('row', 0))
                  if fw <= 0 or fh <= 0 or (start + frames) * fw > width or (row + 1) * fh > height:
                      raise SystemExit(
                          f'wildlife animation grid outside atlas: {monster_id}/{anim_name} -> {ref} '
                          f'frame={fw}x{fh} start={start} frames={frames} row={row} image={width}x{height}'
                      )

          # A concise edit map lives next to the assets. Artists should edit PNGs only;
          # sidecars preserve engine identity and should be left alone.
          readme_lines = [
              '# Procedural World Visuals',
              '',
              'These are the **54 visual PNGs currently wired into the Romestead-derived procedural world pipeline**.',
              'They were moved here without changing image bytes, dimensions, atlas coordinates, or Godot UIDs.',
              '',
              '## Editing rule',
              '',
              'Replace/redraw pixels inside the existing canvas and atlas slots. Keep each PNG filename, canvas size, slot positions and transparency layout unless the corresponding metadata/code is updated at the same time.',
              '',
              'Do **not** manually edit or delete the `.png.import` files. They preserve Godot import settings and asset UIDs.',
              '',
              '## Folders',
              '',
              '- `terrain/` — biome ground sheets, dense-forest wall/canopy sheets, terrain details, plains cliff atlas.',
              '- `trees/` — trunks/stumps and tree canopy atlases.',
              '- `rocks/` — large/small rocks, mossy boulder and copper ore.',
              '- `plants/` — bushes, wheat, flowers, mushrooms and tiny ground vegetation.',
              '- `objects/` — standalone procedural-world object art (currently the tier-0 brazier; auto-spawn is disabled in the integrated map).',
              '- `wildlife/` — squirrel, rabbit, female deer and bird animation sheets.',
              '',
              '## Current files',
              '',
          ]
          for category, info in groups.items():
              readme_lines += [f'### {category}', '']
              readme_lines += [f'- `{name}`' for name in info['files']]
              readme_lines += ['']
          readme_lines += [
              '## Migration checks performed',
              '',
              '- Exactly 54 PNGs in the manifest, with no duplicate source or destination.',
              '- Every PNG and `.png.import` sidecar existed before the move.',
              '- No destination collision existed.',
              '- SHA-256 and PNG dimensions were identical before/after the move.',
              '- Every Godot UID was preserved.',
              '- Every old direct `res://` reference to these 54 images was removed.',
              '- Every new procedural-world PNG reference resolves to an existing file.',
              '- All JSON files in `data/` still parse.',
              '- Every `sprites.json` region referencing a moved image stays inside its PNG bounds.',
              '- Every moved wildlife animation grid stays inside its PNG bounds.',
              '',
              'The separate lighting cookie SVG remains outside this folder because it is not one of the sprite/atlas PNGs and moving it was unnecessary risk.',
              '',
          ]
          new_base.mkdir(parents=True, exist_ok=True)
          (new_base / 'README.md').write_text('\n'.join(readme_lines), encoding='utf-8')

          # Final manifest sanity after README generation.
          actual_pngs = sorted(new_base.rglob('*.png'))
          expected_pngs = sorted(mapping.values())
          if actual_pngs != expected_pngs:
              extra = sorted(set(actual_pngs) - set(expected_pngs))
              absent = sorted(set(expected_pngs) - set(actual_pngs))
              raise SystemExit(f'final 54-file set mismatch; extra={extra}; missing={absent}')

          print('SAFE MIGRATION VALIDATED')
          print(f'PNG files moved: {len(mapping)}')
          print(f'Godot UIDs preserved: {len(before_uids)}')
          print(f'Direct old references observed pre-move: {sum(len(v) for v in direct_old_refs.values())}')
          PY

          git diff --check
          echo "--- migrated tree ---"
          find assets/sprites/world/procedural -maxdepth 2 -type f | sort
          echo "--- status ---"
          git status --short

      - name: Commit only after all checks pass
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/organize_procedural_sprites.yml
          git add -A
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: organize procedural world sprites safely"
          git push origin HEAD:feature/procedural-terrain-grass-v1
