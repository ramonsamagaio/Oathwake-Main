name: Apply Effect Preview Type Hotfix

on:
  push:
    branches:
      - hotfix/effect-preview-type-cache
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-hotfix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hotfix/effect-preview-type-cache
          fetch-depth: 0
      - name: Remove dependency on global script class cache
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tools/content_editor/ContentEditorShaderSuite.gd')
          text = path.read_text(encoding='utf-8')
          text = text.replace('var effect_preview: EffectPreviewPanel', 'var effect_preview: SubViewportContainer')
          text = text.replace('effect_preview = EffectPreviewPanelScript.new() as EffectPreviewPanel', 'effect_preview = EffectPreviewPanelScript.new() as SubViewportContainer')
          path.write_text(text, encoding='utf-8')
          PY
          if git diff --quiet; then
            echo "Hotfix already applied."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/content_editor/ContentEditorShaderSuite.gd
          git commit -m "fix: avoid global preview class cache dependency"
          git push origin HEAD:hotfix/effect-preview-type-cache
