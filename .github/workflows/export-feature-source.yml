name: Apply Elemental Feature Patch

on:
  pull_request:
    branches: [main]
    paths:
      - ".feature/apply-bundle.tar.gz"
      - ".github/workflows/export-feature-source.yml"

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Apply feature bundle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/oathwake-feature-bundle
          tar -xzf .feature/apply-bundle.tar.gz -C /tmp/oathwake-feature-bundle
          cp -a /tmp/oathwake-feature-bundle/scripts .
          cp -a /tmp/oathwake-feature-bundle/.github .
          patch -p1 --forward < /tmp/oathwake-feature-bundle/changes.patch
          rm -rf \
            "assets/sprites/characters/2D-Pixel-Art-Character-Template/Run Top Down" \
            "assets/sprites/characters/2D-Pixel-Art-Character-Template/Run Top Down V2" \
            "assets/sprites/characters/2D-Pixel-Art-Character-Template/Run Top Down V3" \
            "assets/sprites/characters/2D-Pixel-Art-Character-Template/Run Top Down V3 REVIEW" \
            "assets/sprites/characters/2D-Pixel-Art-Character-Template/Run Top Down V4" \
            "assets/sprites/characters/2D-Pixel-Art-Character-Template/Run Top Down V5" \
            "assets/sprites/characters/2D-Pixel-Art-Character-Template/Run Top Down V6" \
            "assets/sprites/characters/2D-Pixel-Art-Character-Template/Run Top Down V7"
          rm -rf .feature
          rm -f .github/workflows/export-feature-source.yml
          rm -f .github/workflows/validate-elemental-campfire-inventory.yml
          git config user.name "Oathwake Automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "feat: add elemental hazards smart AI and refined inventory details"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
