name: Export Feature Source

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/export-feature-source.yml"
  push:
    branches:
      - feature/elemental-campfire-ai-inventory
    paths:
      - ".github/workflows/export-feature-source.yml"

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: oathwake-feature-source
          include-hidden-files: true
          retention-days: 1
          path: |
            .
            !.git/**
            !.godot/**
            !builds/**
