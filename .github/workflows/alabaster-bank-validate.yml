name: Alabaster Bank Validation

on:
  push:
    branches:
      - ALABASTER_OPTIMIZATION

jobs:
  validate-bank:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Zstandard
        run: python -m pip install --quiet zstandard
      - name: Validate repository animation streams
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64
          import zstandard as zstd

          root = Path('.')
          full_parts = [
              'data/labs/alabaster/anims/juno_anims_bin_00.part',
              'data/labs/alabaster/anims/juno_anims_bin_01.part',
              'data/labs/alabaster/anims/juno_anims_bin_02.part',
              'data/labs/alabaster/anims/juno_anims_bin_03.part',
              'data/labs/alabaster/anims/juno_anims_bin_04.part',
              'data/labs/alabaster/anims/juno_anims_bin_05_06.part',
              'data/labs/alabaster/anims/juno_anims_bin_07_08.part',
              'data/labs/alabaster/anims/juno_anims_bin_09_10.part',
              'data/labs/alabaster/anims/juno_anims_bin_11_12.part',
              'data/labs/alabaster/anims/juno_anims_bin_13_14.part',
              'data/labs/alabaster/anims/juno_anims_bin_15_16.part',
              'data/labs/alabaster/anims/juno_anims_bin_17_18.part',
              'data/labs/alabaster/anims/juno_anims_bin_19_20.part',
          ]
          gameplay_parts = [f'data/labs/alabaster/juno_gameplay_anims_{i:02d}.part' for i in range(8)]

          required = [
              'idle', 'walk', 'run', 'idleJump1', 'damage', 'dead', 'guard', 'guardParry', 'respawn', 'castPoint',
              'atkSwordN1', 'atkSwordN2', 'atkSwordNFinisher', 'atkSwordTripleSlash', 'atkSwordCrossStrike',
              'atkHammer1fast', 'atkHammer2', 'atkHammer3', 'atkSpear1', 'atkTonfa1-punch',
          ]

          def read_stream(paths):
              text = ''.join(''.join((root / p).read_text(encoding='utf-8').split()) for p in paths)
              text = text.replace('-', '+').replace('_', '/')
              text = text.rstrip('=')
              rem = len(text) % 4
              if rem == 1:
                  raise RuntimeError(f'impossible Base64 length: {len(text)} mod4=1')
              text += '=' * ((4 - rem) % 4)
              compressed = base64.b64decode(text, validate=True)
              if compressed[:4] != bytes.fromhex('28b52ffd'):
                  raise RuntimeError(f'not ZSTD: {compressed[:8].hex()}')
              return text, compressed

          def jani_count(raw):
              if raw[:5] != b'JANI1':
                  raise RuntimeError(f'not JANI1: {raw[:16]!r}')
              pos = 5
              node_count = raw[pos]
              pos += 1
              for _ in range(node_count):
                  n = raw[pos]
                  pos += 1 + n
              return int.from_bytes(raw[pos:pos+2], 'little'), node_count

          full_text, full_compressed = read_stream(full_parts)
          full_raw = zstd.ZstdDecompressor().decompress(full_compressed, max_output_size=8 * 1024 * 1024)
          full_count, full_nodes = jani_count(full_raw)
          print(f'FULL parts={len(full_parts)} chars={len(full_text)} compressed={len(full_compressed)} raw={len(full_raw)} nodes={full_nodes} animations={full_count}')
          assert len(full_raw) == 671589, (len(full_raw), 671589)
          assert full_count == 419, full_count
          missing = [name for name in required if name.encode('utf-8') not in full_raw]
          print(f'FULL required={len(required)-len(missing)}/{len(required)} missing={missing}')
          assert not missing, missing

          gameplay_text, gameplay_compressed = read_stream(gameplay_parts)
          gameplay_raw = zstd.ZstdDecompressor().decompress(gameplay_compressed, max_output_size=8 * 1024 * 1024)
          gameplay_count, gameplay_nodes = jani_count(gameplay_raw)
          gameplay_missing = [name for name in required if name.encode('utf-8') not in gameplay_raw]
          print(f'GAMEPLAY parts={len(gameplay_parts)} chars={len(gameplay_text)} compressed={len(gameplay_compressed)} raw={len(gameplay_raw)} nodes={gameplay_nodes} animations={gameplay_count}')
          print(f'GAMEPLAY required={len(required)-len(gameplay_missing)}/{len(required)} missing={gameplay_missing}')
          assert not gameplay_missing, gameplay_missing
          PY