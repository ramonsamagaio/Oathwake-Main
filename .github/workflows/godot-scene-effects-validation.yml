name: Godot Scene Effects Validation

on:
  push:
    branches:
      - fix/stable-fog-outline-glow
  pull_request:
    paths:
      - "scenes/effects/**"
      - "scenes/items/WorldItem.tscn"
      - "scripts/effects/**"
      - "scripts/items/WorldItemShaderSuite.gd"
      - "scripts/test/SceneEffectsRenderValidator.gd"
      - "shaders/**"
      - ".github/workflows/godot-scene-effects-validation.yml"
  workflow_dispatch:

concurrency:
  group: godot-scene-effects-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  render-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Inventory dynamic texture generators
        shell: bash
        run: |
          grep -R -n -E \
            --include='*.gd' \
            'Image\.create|ImageTexture\.create_from_image|create_from_image' \
            . | tee image-construction-sites.log || true
          grep -R -n -E \
            --include='*.tscn' --include='*.tres' \
            'NoiseTexture2D|GradientTexture2D|CurveTexture|ImageTexture' \
            . | tee generated-texture-resources.log || true

      - name: Install software rendering dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb unzip libgl1-mesa-dri libglx-mesa0 mesa-utils

      - name: Download official Godot 4.6.3
        run: |
          curl --fail --location --retry 4 --retry-delay 3 \
            --output godot.zip \
            https://github.com/godotengine/godot-builds/releases/download/4.6.3-stable/Godot_v4.6.3-stable_linux.x86_64.zip
          unzip -q godot.zip
          mv Godot_v4.6.3-stable_linux.x86_64 godot
          chmod +x godot
          ./godot --version

      - name: Import project and compile resources
        shell: bash
        run: |
          set -o pipefail
          xvfb-run -a ./godot \
            --editor \
            --path . \
            --rendering-method gl_compatibility \
            --display-driver x11 \
            --quit-after 240 \
            --verbose 2>&1 | tee godot-import.log

      - name: Isolate dynamic-image scene sources
        shell: bash
        run: |
          set -o pipefail
          declare -A scenes=(
            [glow_overlay]="res://scenes/effects/GlowOverlay.tscn"
            [content_editor]="res://tools/content_editor/ContentEditor.tscn"
            [ui_playground]="res://scenes/ui/UIPlayground.tscn"
            [slime]="res://scenes/enemies/Slime.tscn"
            [player]="res://scenes/Player.tscn"
            [start_area]="res://scenes/maps/StartArea.tscn"
            [monster_spawn_zone]="res://scenes/systems/MonsterSpawnZone.tscn"
            [legacy_main]="res://scenes/Main.tscn"
          )
          for key in glow_overlay content_editor ui_playground slime player start_area monster_spawn_zone legacy_main; do
            xvfb-run -a ./godot \
              --path . \
              --rendering-method gl_compatibility \
              --display-driver x11 \
              --quit-after 60 \
              "${scenes[$key]}" \
              --verbose 2>&1 | tee "isolated-${key}.log"
          done

      - name: Render and inspect scene effects
        shell: bash
        run: |
          set -o pipefail
          xvfb-run -a ./godot \
            --path . \
            --rendering-method gl_compatibility \
            --display-driver x11 \
            --script res://scripts/test/SceneEffectsRenderValidator.gd \
            --verbose 2>&1 | tee scene-effects-validation.log

      - name: Open the real game scene briefly
        shell: bash
        run: |
          set -o pipefail
          xvfb-run -a ./godot \
            --path . \
            --rendering-method gl_compatibility \
            --display-driver x11 \
            --quit-after 180 \
            res://scenes/game/Game.tscn \
            --verbose 2>&1 | tee game-scene-smoke-test.log

      - name: Reject renderer and empty-image regressions
        shell: bash
        run: |
          set -o pipefail
          if grep -E -i \
            'Shader compilation failed|Parameter "version" is null|Using .return. in the .(vertex|fragment). processor|Image width specified \(0 pixels\)|Invalid image: image is empty' \
            godot-import.log isolated-*.log scene-effects-validation.log game-scene-smoke-test.log; then
            echo "A known shader or empty-image regression was detected."
            exit 1
          fi

      - name: Upload rendered proof and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scene-effects-render-proof
          path: |
            test_artifacts/scene_effects/*.png
            image-construction-sites.log
            generated-texture-resources.log
            godot-import.log
            isolated-*.log
            scene-effects-validation.log
            game-scene-smoke-test.log
          if-no-files-found: warn
