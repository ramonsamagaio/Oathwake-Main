name: Godot Content Effects Validation

on:
  push:
    branches:
      - fix/stable-fog-outline-glow
      - feature/content-editor-effects-previews-audio-mixer
  pull_request:
    paths:
      - "tools/content_editor/**"
      - "scenes/effects/**"
      - "scenes/items/WorldItem.tscn"
      - "scripts/effects/**"
      - "scripts/items/WorldItemShaderSuite.gd"
      - "scripts/audio/**"
      - "scripts/game/GameplayAudioController.gd"
      - "scripts/test/**"
      - "shaders/**"
      - "data/audio_mix.json"
      - ".github/workflows/godot-scene-effects-validation.yml"
  workflow_dispatch:

concurrency:
  group: godot-content-effects-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  render-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Inventory dynamic texture generators
        shell: bash
        run: |
          grep -R -n -E \
            --include='*.gd' \
            'Image\.create|ImageTexture\.create_from_image|create_from_image' \
            . | tee image-construction-sites.log || true
          grep -R -n -E \
            --include='*.tscn' --include='*.tres' \
            'NoiseTexture2D|GradientTexture2D|CurveTexture|ImageTexture' \
            . | tee generated-texture-resources.log || true

      - name: Install software rendering dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb unzip libgl1-mesa-dri libglx-mesa0 mesa-utils

      - name: Download official Godot 4.6.3
        run: |
          curl --fail --location --retry 4 --retry-delay 3 \
            --output godot.zip \
            https://github.com/godotengine/godot-builds/releases/download/4.6.3-stable/Godot_v4.6.3-stable_linux.x86_64.zip
          unzip -q godot.zip
          mv Godot_v4.6.3-stable_linux.x86_64 godot
          chmod +x godot
          ./godot --version

      - name: Import project and compile resources
        shell: bash
        run: |
          set -o pipefail
          xvfb-run -a ./godot \
            --editor \
            --path . \
            --rendering-method gl_compatibility \
            --display-driver x11 \
            --quit-after 240 \
            --verbose 2>&1 | tee godot-import.log

      - name: Open integrated Content Editor
        shell: bash
        run: |
          set -o pipefail
          xvfb-run -a ./godot \
            --path . \
            --rendering-method gl_compatibility \
            --display-driver x11 \
            --quit-after 180 \
            res://tools/content_editor/ContentEditor.tscn \
            --verbose 2>&1 | tee integrated-content-editor.log

      - name: Exercise integrated editor sections and previews
        shell: bash
        run: |
          set -o pipefail
          xvfb-run -a ./godot \
            --path . \
            --rendering-method gl_compatibility \
            --display-driver x11 \
            --script res://scripts/test/IntegratedContentEditorValidator.gd \
            --verbose 2>&1 | tee integrated-content-editor-validation.log

      - name: Isolate authored and composed scenes
        shell: bash
        run: |
          set -o pipefail
          declare -A scenes=(
            [glow_overlay]="res://scenes/effects/GlowOverlay.tscn"
            [ui_playground]="res://scenes/ui/UIPlayground.tscn"
            [slime]="res://scenes/enemies/Slime.tscn"
            [player]="res://scenes/Player.tscn"
            [authored_start_area]="res://scenes/maps/Start_Area.tscn"
            [start_area]="res://scenes/maps/StartArea.tscn"
            [monster_spawn_zone]="res://scenes/systems/MonsterSpawnZone.tscn"
            [legacy_main]="res://scenes/Main.tscn"
          )
          for key in glow_overlay ui_playground slime player authored_start_area start_area monster_spawn_zone legacy_main; do
            xvfb-run -a ./godot \
              --path . \
              --rendering-method gl_compatibility \
              --display-driver x11 \
              --quit-after 60 \
              "${scenes[$key]}" \
              --verbose 2>&1 | tee "isolated-${key}.log"
          done

      - name: Isolate each resource type
        shell: bash
        run: |
          set -o pipefail
          for kind in tree oak rock coal fiber herb berry; do
            xvfb-run -a ./godot \
              --path . \
              --rendering-method gl_compatibility \
              --display-driver x11 \
              --script res://scripts/test/ResourceSceneIsolationRunner.gd \
              -- --kind="$kind" \
              --verbose 2>&1 | tee "isolated-resource-${kind}.log"
          done

      - name: Render and inspect scene effects
        shell: bash
        run: |
          set -o pipefail
          xvfb-run -a ./godot \
            --path . \
            --rendering-method gl_compatibility \
            --display-driver x11 \
            --script res://scripts/test/SceneEffectsRenderValidator.gd \
            --verbose 2>&1 | tee scene-effects-validation.log

      - name: Open the real game scene briefly
        shell: bash
        run: |
          set -o pipefail
          xvfb-run -a ./godot \
            --path . \
            --rendering-method gl_compatibility \
            --display-driver x11 \
            --quit-after 180 \
            res://scenes/game/Game.tscn \
            --verbose 2>&1 | tee game-scene-smoke-test.log

      - name: Reject script and shader regressions everywhere
        shell: bash
        run: |
          set -o pipefail
          if grep -E -i \
            'SCRIPT ERROR|Parse Error|Shader compilation failed|Parameter "version" is null|Using .return. in the .(vertex|fragment). processor|INTEGRATED_CONTENT_EDITOR_FAILURE' \
            godot-import.log integrated-content-editor.log integrated-content-editor-validation.log isolated-*.log scene-effects-validation.log game-scene-smoke-test.log; then
            echo "A script, shader or integrated editor regression was detected."
            exit 1
          fi

      - name: Reject new empty-image regressions in integrated features
        shell: bash
        run: |
          set -o pipefail
          if grep -E -i \
            'Image width specified \(0 pixels\)|Invalid image: image is empty' \
            integrated-content-editor.log integrated-content-editor-validation.log scene-effects-validation.log; then
            echo "The integrated Content Editor or effect previews created an empty image."
            exit 1
          fi

      - name: Report legacy empty-image warnings without hiding them
        if: always()
        shell: bash
        run: |
          grep -E -i \
            'Image width specified \(0 pixels\)|Invalid image: image is empty' \
            godot-import.log isolated-*.log game-scene-smoke-test.log || true

      - name: Upload rendered proof and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: content-effects-render-proof
          path: |
            tools/content_editor/ContentEditorShaderSuite.gd
            test_artifacts/scene_effects/*.png
            test_artifacts/content_editor/*.png
            image-construction-sites.log
            generated-texture-resources.log
            godot-import.log
            integrated-content-editor.log
            integrated-content-editor-validation.log
            isolated-*.log
            scene-effects-validation.log
            game-scene-smoke-test.log
          if-no-files-found: warn
