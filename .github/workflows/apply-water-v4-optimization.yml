name: Apply Water V4 Optimization

on:
  push:
    branches:
      - tmp-pixel-water-build-20260811
    paths:
      - '.github/workflows/apply-water-v4-optimization.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp-pixel-water-build-20260811
          fetch-depth: 0

      - name: Apply optimization patch
        run: python .tmp/pixel-water/tools/apply_v4_patch.py

      - name: Commit optimization pass
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .tmp/pixel-water/addons/pixel_water/pixel_water_world.gd \
                  .tmp/pixel-water/addons/pixel_water/buoyant_body.gd \
                  .tmp/pixel-water/demo/main.gd
          git commit -m "perf: stabilize and lighten unified water solver"
          git push origin HEAD:tmp-pixel-water-build-20260811

# rerun: v4.1
