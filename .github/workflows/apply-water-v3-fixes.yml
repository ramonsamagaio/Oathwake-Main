name: Apply Water V3 Fixes

on:
  push:
    branches:
      - tmp-pixel-water-build-20260811
    paths:
      - '.github/workflows/apply-water-v3-fixes.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp-pixel-water-build-20260811
          fetch-depth: 0

      - name: Patch unified water solver and demo
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          world_path = Path('.tmp/pixel-water/addons/pixel_water/pixel_water_world.gd')
          main_path = Path('.tmp/pixel-water/demo/main.gd')

          s = world_path.read_text(encoding='utf-8')

          def replace_once(old, new, label):
              global s
              if old not in s:
                  raise SystemExit(f'missing patch anchor: {label}')
              s = s.replace(old, new, 1)

          replace_once(
              '@export_range(2, 24, 1) var max_substeps: int = 12',
              '@export_range(2, 48, 1) var max_substeps: int = 28',
              'substeps'
          )
          replace_once(
              '@export_range(0.0, 4.0, 0.01) var linear_flow_damping: float = 0.34',
              '@export_range(0.0, 4.0, 0.01) var linear_flow_damping: float = 0.62',
              'linear damping'
          )
          replace_once(
              '@export_range(0.0, 2.0, 0.01) var quadratic_flow_damping: float = 0.10',
              '@export_range(0.0, 2.0, 0.01) var quadratic_flow_damping: float = 0.16',
              'quadratic damping'
          )
          replace_once(
              '@export_range(0.0, 0.8, 0.01) var momentum_neighbor_mix: float = 0.035',
              '@export_range(0.0, 0.8, 0.01) var momentum_neighbor_mix: float = 0.020\n@export_range(0.0, 0.20, 0.005) var rest_velocity_m_s: float = 0.035\n@export_range(0.0, 3.0, 0.05) var rest_surface_delta_px: float = 0.45\n@export_range(4.0, 80.0, 1.0) var waterfall_drop_threshold_px: float = 12.0',
              'rest controls'
          )
          replace_once(
              '@export_range(0.0, 1.0, 0.01) var spray_volume_fraction: float = 0.12',
              '@export_range(0.0, 1.0, 0.01) var spray_volume_fraction: float = 0.025',
              'spray fraction'
          )
          replace_once(
              'var _foam_accumulator := 0.0\nvar _configured := false',
              'var _foam_accumulator := 0.0\nvar _waterfall_pending: Dictionary = {}\nvar _configured := false',
              'waterfall pending var'
          )
          replace_once(
              '    _foam.clear()\n    queue_redraw()\n\nfunc _physics_process',
              '    _foam.clear()\n    _waterfall_pending.clear()\n    queue_redraw()\n\nfunc _physics_process',
              'reset waterfall'
          )
          replace_once(
              '    var dt := delta / float(substeps)\n\n    for _step in range(substeps):\n        _shallow_water_substep(dt)\n\n    _simulate_droplets(delta)',
              '    var dt := delta / float(substeps)\n    _waterfall_pending.clear()\n\n    for _step in range(substeps):\n        _shallow_water_substep(dt)\n\n    _flush_waterfalls()\n    _simulate_droplets(delta)',
              'physics waterfall flush'
          )
          replace_once(
              '        _momentum_flux_right[face] = (\n            momentum_flux\n            + 0.5 * g * (h_r_raw * h_r_raw - h_r * h_r)\n        )\n\n    for i in range(_cell_count):',
              '        _momentum_flux_right[face] = (\n            momentum_flux\n            + 0.5 * g * (h_r_raw * h_r_raw - h_r * h_r)\n        )\n\n    # Positivity-preserving draining limiter. A face may never remove more\n    # water from its donor cell than that cell actually owns during this step.\n    # Without this, clamping negative depth to zero can create water in the\n    # receiver and is the main source of runaway vertical columns.\n    _limit_outflow_fluxes(dt, dx)\n\n    # A shallow-water height field cannot show ballistic free-fall at a cliff.\n    # Route flux over a real downward terrain step into conservative droplets\n    # until the receiving basin rises high enough to submerge the lip.\n    _route_waterfall_fluxes(dt, dx)\n\n    for i in range(_cell_count):',
              'flux limiter insertion'
          )

          # Add a small true-rest condition after physical damping.
          replace_once(
              '            u -= nonlinear_loss\n            u = clampf(u, -max_flow_speed_m_s, max_flow_speed_m_s)\n            hu_new = u * h_new',
              '            u -= nonlinear_loss\n            u = clampf(u, -max_flow_speed_m_s, max_flow_speed_m_s)\n\n            if absf(u) <= rest_velocity_m_s and _surface_is_locally_calm(i):\n                u = 0.0\n\n            hu_new = u * h_new',
              'rest state'
          )

          helpers = r'''
func _limit_outflow_fluxes(dt: float, dx: float) -> void:
    if dt <= 0.0 or dx <= 0.0:
        return

    var donor_scale := PackedFloat32Array()
    donor_scale.resize(_cell_count)
    donor_scale.fill(1.0)

    for i in range(_cell_count):
        var outgoing := 0.0
        if i > 0:
            outgoing += maxf(-_mass_flux[i - 1], 0.0)
        if i < _cell_count - 1:
            outgoing += maxf(_mass_flux[i], 0.0)

        if outgoing <= 0.0000001:
            continue

        var owned_depth := maxf(_depth_m[i], 0.0)
        var max_outgoing_flux := owned_depth * dx / dt
        donor_scale[i] = clampf(
            max_outgoing_flux / outgoing,
            0.0,
            1.0
        )

    for face in range(_cell_count - 1):
        var flux := _mass_flux[face]
        if absf(flux) <= 0.0000001:
            continue
        var donor := face if flux > 0.0 else face + 1
        var scale := donor_scale[donor]
        if scale >= 0.99999:
            continue
        _mass_flux[face] *= scale
        _momentum_flux_left[face] *= scale
        _momentum_flux_right[face] *= scale

func _route_waterfall_fluxes(dt: float, dx: float) -> void:
    if dt <= 0.0 or dx <= 0.0:
        return

    for face in range(_cell_count - 1):
        var flux := _mass_flux[face]
        if absf(flux) <= 0.0000001:
            continue

        var donor := face if flux > 0.0 else face + 1
        var receiver := face + 1 if flux > 0.0 else face
        var donor_floor := _floor_y[donor]
        var receiver_floor := _floor_y[receiver]

        # Screen Y grows downward, so a larger receiver floor is a physical drop.
        var drop_px := receiver_floor - donor_floor
        if drop_px < waterfall_drop_threshold_px:
            continue

        var receiver_has_water := _depth_m[receiver] > dry_depth_m
        if receiver_has_water:
            var receiver_surface := _surface_y_index(receiver)
            # Once downstream water reaches the lip, the two water bodies are
            # hydraulically connected again and the normal solver takes over.
            if receiver_surface <= donor_floor + cell_size_px * 0.5:
                continue

        var transfer_depth := absf(flux) * dt / dx
        transfer_depth = minf(
            transfer_depth,
            maxf(_depth_m[donor] - dry_depth_m * 0.25, 0.0)
        )
        if transfer_depth <= 0.0:
            _mass_flux[face] = 0.0
            _momentum_flux_left[face] = 0.0
            _momentum_flux_right[face] = 0.0
            continue

        var donor_u := _velocity_at_index(donor)
        _depth_m[donor] = maxf(0.0, _depth_m[donor] - transfer_depth)
        _momentum_m2_s[donor] = _depth_m[donor] * donor_u

        var volume_m3 := (
            transfer_depth
            * dx
            * fluid_depth_m
        )
        var face_x := world_left + float(face + 1) * cell_size_px
        var key := face
        var packet: Dictionary = _waterfall_pending.get(key, {})
        if packet.is_empty():
            packet = {
                "volume_m3": 0.0,
                "x": face_x,
                "y": donor_floor - cell_size_px * 0.35,
                "vx_px_s": donor_u * pixels_per_meter
            }
        packet["volume_m3"] = float(packet["volume_m3"]) + volume_m3
        packet["vx_px_s"] = lerpf(
            float(packet["vx_px_s"]),
            donor_u * pixels_per_meter,
            0.35
        )
        _waterfall_pending[key] = packet

        # No horizontal teleport across this face. The same conserved volume is
        # now represented by falling packets and will re-enter on impact.
        _mass_flux[face] = 0.0
        _momentum_flux_left[face] = 0.0
        _momentum_flux_right[face] = 0.0

func _flush_waterfalls() -> void:
    for key in _waterfall_pending.keys():
        var packet: Dictionary = _waterfall_pending[key]
        var amount := maxf(float(packet.get("volume_m3", 0.0)), 0.0)
        if amount <= 0.0:
            continue

        var liters := amount * 1000.0
        var count := clampi(
            int(ceil(2.0 + sqrt(maxf(liters, 0.0)) * 5.0)),
            2,
            24
        )
        emit_water_stream(
            Vector2(
                float(packet.get("x", 0.0)),
                float(packet.get("y", 0.0))
            ),
            amount,
            Vector2(float(packet.get("vx_px_s", 0.0)), 24.0),
            count
        )
    _waterfall_pending.clear()

func _surface_is_locally_calm(i: int) -> bool:
    var sy := _surface_y_index(i)
    if i > 0 and _depth_m[i - 1] > dry_depth_m:
        if absf(_surface_y_index(i - 1) - sy) > rest_surface_delta_px:
            return false
    if i < _cell_count - 1 and _depth_m[i + 1] > dry_depth_m:
        if absf(_surface_y_index(i + 1) - sy) > rest_surface_delta_px:
            return false
    return true

'''
          marker = 'func _rebuild_solid_displacement() -> void:\n'
          if marker not in s:
              raise SystemExit('missing helper insertion marker')
          s = s.replace(marker, helpers + marker, 1)

          # Replace destructive nearest-cell extraction with a broad conservative scoop.
          pattern = re.compile(r'func extract_water_at\(.*?\nfunc deposit_water_at\(', re.S)
          m = pattern.search(s)
          if not m:
              raise SystemExit('extract_water_at block not found')
          new_extract = r'''func extract_water_at(
    world_x: float,
    requested_volume_m3: float,
    radius_px: float = 18.0
) -> float:
    var requested := maxf(requested_volume_m3, 0.0)
    if requested <= 0.0:
        return 0.0

    var center := _index_at(world_x)
    var radius_cells := maxi(1, int(ceil(radius_px / cell_size_px)))
    var first := maxi(0, center - radius_cells)
    var last := mini(_cell_count - 1, center + radius_cells)
    var cell_width_m := cell_size_px / pixels_per_meter
    var cell_area := maxf(cell_width_m * fluid_depth_m, 0.000001)

    var capacities: Array[float] = []
    var capacity_sum := 0.0
    for i in range(first, last + 1):
        var available := maxf(_depth_m[i], 0.0) * cell_area
        var distance := absf(float(i - center)) / float(radius_cells + 1)
        var kernel := 0.38 + 0.62 * maxf(0.0, 1.0 - distance)
        # Never excavate a narrow vertical trench in one operation. Repeated
        # interactions may still remove all the water over time.
        var capacity := available * 0.30 * kernel
        capacities.append(capacity)
        capacity_sum += capacity

    var target := minf(requested, capacity_sum)
    if target <= 0.0:
        return 0.0

    var extracted := 0.0
    var cursor := 0
    for i in range(first, last + 1):
        var capacity := capacities[cursor]
        cursor += 1
        if capacity <= 0.0:
            continue
        var take := target * capacity / maxf(capacity_sum, 0.000001)
        take = minf(take, capacity)
        var old_h := maxf(_depth_m[i], 0.0)
        var old_u := _velocity_at_index(i)
        var dh := take / cell_area
        _depth_m[i] = maxf(0.0, old_h - dh)
        _momentum_m2_s[i] = _depth_m[i] * old_u
        extracted += take

    return extracted

func deposit_water_at('''
          s = s[:m.start()] + new_extract + s[m.end():]

          # Spread deposits enough that streams do not create needle-like towers.
          replace_once(
              '    var amount := maxf(volume_m3, 0.0)\n    if amount <= 0.0:\n        return\n\n    var first := _index_at(world_x - radius_px)',
              '    var amount := maxf(volume_m3, 0.0)\n    if amount <= 0.0:\n        return\n\n    var liters := amount * 1000.0\n    radius_px = maxf(\n        radius_px,\n        cell_size_px * 1.5 + sqrt(maxf(liters, 0.0)) * 2.8\n    )\n\n    var first := _index_at(world_x - radius_px)',
              'deposit spreading'
          )

          # Water has one palette everywhere. Deep shade begins only in genuinely
          # deep columns instead of repainting every shallow puddle dark.
          old_draw = '''        var deep_height := minf(72.0, height_px)\n        draw_rect(\n            Rect2(\n                x,\n                maxf(sy, floor_y - deep_height),\n                cell_size_px + 0.6,\n                deep_height\n            ),\n            WATER_DEEP\n        )'''
          new_draw = '''        if height_px > 86.0:\n            var deep_height := minf(62.0, height_px - 38.0)\n            draw_rect(\n                Rect2(\n                    x,\n                    floor_y - deep_height,\n                    cell_size_px + 0.6,\n                    deep_height\n                ),\n                WATER_DEEP\n            )'''
          replace_once(old_draw, new_draw, 'deep color rendering')
          replace_once(
              '            WATER_GLINT\n        )',
              '            WATER_MID\n        )',
              'droplet body color'
          )

          world_path.write_text(s, encoding='utf-8')

          mtxt = main_path.read_text(encoding='utf-8')
          replacements = [
              ('water.linear_flow_damping = 0.36', 'water.linear_flow_damping = 0.68'),
              ('water.quadratic_flow_damping = 0.105', 'water.quadratic_flow_damping = 0.17'),
              ('water.momentum_neighbor_mix = 0.030', 'water.momentum_neighbor_mix = 0.018'),
              ('bucket.capacity_liters = 16.0', 'bucket.capacity_liters = 9.0'),
              (
                  '        + "dip the transparent bucket, lift it, tilt to pour into the small basin"',
                  '        + "bucket stays balanced while held • wheel or Q/E tilts it to pour"'
              )
          ]
          for old, new in replacements:
              if old not in mtxt:
                  raise SystemExit(f'missing main anchor: {old}')
              mtxt = mtxt.replace(old, new, 1)
          main_path.write_text(mtxt, encoding='utf-8')
          PY

      - name: Commit fixes
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/apply-water-v3-fixes.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: stabilize water, render waterfalls, unify color'
          git push origin HEAD:tmp-pixel-water-build-20260811
