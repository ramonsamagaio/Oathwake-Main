name: Apply Water V3 Fixes

on:
  push:
    branches:
      - tmp-pixel-water-build-20260811
    paths:
      - '.github/workflows/apply-water-v3-fixes.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp-pixel-water-build-20260811
          fetch-depth: 0

      - name: Patch unified water solver and demo
        run: python .ci/water_v3_patch.py

      - name: Commit fixes
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/apply-water-v3-fixes.yml
          rm -f .ci/water_v3_patch.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: stabilize water, render waterfalls, unify color'
          git push origin HEAD:tmp-pixel-water-build-20260811
