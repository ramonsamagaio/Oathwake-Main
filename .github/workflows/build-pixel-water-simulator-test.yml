name: Build Pixel Water Simulator Windows Test

on:
  push:
    branches:
      - tmp-pixel-water-build-20260811
    paths:
      - ".tmp/pixel-water/**"
      - ".github/workflows/build-pixel-water-simulator-test.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Checkout temporary build branch
        uses: actions/checkout@v4

      - name: Download Godot 4.3 Windows
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Invoke-WebRequest -Uri "https://github.com/godotengine/godot-builds/releases/download/4.3-stable/Godot_v4.3-stable_win64.exe.zip" -OutFile "godot.zip"
          Expand-Archive -LiteralPath "godot.zip" -DestinationPath "godot-bin" -Force
          $godot = Get-ChildItem -Path "godot-bin" -Filter "Godot_v4.3-stable_win64.exe" -Recurse | Select-Object -First 1
          if (-not $godot) { throw "Godot executable not found" }
          Copy-Item $godot.FullName "godot.exe" -Force
          .\godot.exe --version

      - name: Parse and smoke-test simulator + integration components
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"
          .\godot.exe --headless --path ".tmp\pixel-water" --editor --quit-after 8 2>&1 | Tee-Object -FilePath "editor.log"
          $editorCode = $LASTEXITCODE

          .\godot.exe --headless --path ".tmp\pixel-water" --quit-after 8 2>&1 | Tee-Object -FilePath "runtime.log"
          $runtimeCode = $LASTEXITCODE

          .\godot.exe --headless --path ".tmp\pixel-water" "res://examples/floating_platform_example.tscn" --quit-after 3 2>&1 | Tee-Object -FilePath "platform.log"
          $platformCode = $LASTEXITCODE

          .\godot.exe --headless --path ".tmp\pixel-water" "res://examples/swimmer_player_example.tscn" --quit-after 3 2>&1 | Tee-Object -FilePath "swimmer.log"
          $swimmerCode = $LASTEXITCODE

          $log = (
            (Get-Content "editor.log" -Raw)
            + "`n" + (Get-Content "runtime.log" -Raw)
            + "`n" + (Get-Content "platform.log" -Raw)
            + "`n" + (Get-Content "swimmer.log" -Raw)
          )
          if (
            $editorCode -ne 0
            -or $runtimeCode -ne 0
            -or $platformCode -ne 0
            -or $swimmerCode -ne 0
            -or $log -match "Parse Error|Compile Error|SCRIPT ERROR|Failed to load script|Invalid call|Invalid access"
          ) {
            Write-Host $log
            throw "Godot smoke test failed (editor=$editorCode runtime=$runtimeCode platform=$platformCode swimmer=$swimmerCode)"
          }

      - name: Assemble portable Windows folder
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force -Path "dist\project" | Out-Null
          Copy-Item ".tmp\pixel-water\*" "dist\project" -Recurse -Force
          Copy-Item ".\godot.exe" "dist\pixel_water_runtime.exe" -Force

      - name: Build double-click launcher
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $source = @'
          using System;
          using System.Diagnostics;
          using System.IO;
          using System.Windows.Forms;

          internal static class PixelWaterLauncher
          {
              [STAThread]
              private static int Main(string[] args)
              {
                  string dir = AppDomain.CurrentDomain.BaseDirectory;
                  string runtime = Path.Combine(dir, "pixel_water_runtime.exe");
                  string project = Path.Combine(dir, "project");
                  if (!File.Exists(runtime) || !File.Exists(Path.Combine(project, "project.godot")))
                  {
                      MessageBox.Show("Simulator files were not found. Extract the entire ZIP before running it.", "Pixel Water Simulator", MessageBoxButtons.OK, MessageBoxIcon.Error);
                      return 2;
                  }
                  var psi = new ProcessStartInfo();
                  psi.FileName = runtime;
                  psi.WorkingDirectory = project;
                  psi.UseShellExecute = false;
                  psi.Arguments = "--path \"" + project + "\"";
                  Process.Start(psi);
                  return 0;
              }
          }
          '@
          $source | Set-Content -Path "launcher.cs" -Encoding UTF8
          $csc = Get-ChildItem "$env:WINDIR\Microsoft.NET\Framework64" -Filter "csc.exe" -Recurse | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $csc) { throw "csc.exe not found" }
          & $csc.FullName /nologo /target:winexe /out:"dist\Pixel Water Simulator.exe" /reference:System.dll /reference:System.Windows.Forms.dll launcher.cs
          if ($LASTEXITCODE -ne 0) { throw "csc launcher compilation failed" }

      - name: Verify double-click build
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          if (-not (Test-Path "dist\Pixel Water Simulator.exe")) { throw "Launcher was not built" }
          if (-not (Test-Path "dist\pixel_water_runtime.exe")) { throw "Godot runtime missing" }
          if (-not (Test-Path "dist\project\project.godot")) { throw "Godot project missing" }

      - name: Add instructions and package
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          @'
          PIXEL WATER SIMULATOR - WINDOWS TEST

          1. Extract the entire ZIP into a folder.
          2. Double-click: Pixel Water Simulator.exe
          3. Keep the EXE inside this folder. It uses the included project folder and Godot runtime.

          Controls:
          - LMB + drag: physically grab / move / throw objects
          - RMB + drag: navigate the scene
          - Bucket: stays balanced while held; Mouse Wheel or Q/E tilts it to pour
          - Selector + Spawn: creates more physics objects
          - Reset objects: returns objects to their spawn positions
          - Reset water: restores the initial water distribution

          GODOT INTEGRATION:
          - Copy project/addons/pixel_water/ into your own Godot project.
          - Add pixel_water_world.tscn to your level.
          - Floating RigidBody2D/platform: add water_buoyancy_2d.tscn as a child. No script replacement required.
          - Swimming CharacterBody2D/player: add water_swimmer_2d.tscn as a child, then add this line immediately before move_and_slide():

            velocity = $WaterSwimmer2D.apply_water_motion(velocity, delta)

          Full quick integration instructions are included in INTEGRATION.md.
          '@ | Set-Content -Path "dist\README.txt" -Encoding UTF8

          Copy-Item ".tmp\pixel-water\addons\pixel_water\README.md" "dist\INTEGRATION.md" -Force
          Compress-Archive -Path "dist\*" -DestinationPath "Pixel-Water-Simulator-Windows-Test.zip" -Force

      - name: Publish private temporary release asset
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          $tag = "pixel-water-windows-test-20260811"
          gh release view $tag --repo "${{ github.repository }}" *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --repo "${{ github.repository }}" --target "${{ github.sha }}" --title "Pixel Water Simulator Windows Test" --notes "Temporary private Windows test build. Includes the Godot 4.3 runtime, integration components and a double-click launcher. CI smoke-tested." --prerelease
          }
          gh release upload $tag "Pixel-Water-Simulator-Windows-Test.zip" --repo "${{ github.repository }}" --clobber

# water-v4 optimized validation
