name: Validate Romestead Retarget Sync

on:
  push:
    branches:
      - fix/romestead-retarget-sync
    paths:
      - 'project.godot'
      - 'scenes/world/RomesteadProceduralGameWorld.tscn'
      - 'scenes/buildings/**'
      - 'scripts/world/**'
      - 'scripts/systems/ProceduralWorldAugment.gd'
      - 'scripts/systems/MultiFloorRuntimeBridge.gd'
      - 'scripts/systems/TibiaFloorVisibilityController.gd'
      - 'scripts/game/GameSession.gd'
      - 'scripts/buildings/**'
      - 'scripts/labs/alabaster/AlabasterJunoBase*.gd'
      - 'scripts/test/OathwakeProceduralWorldAugmentValidator.gd'
      - 'scripts/test/AlabasterJunoBase*.gd'
      - 'assets/sprites/characters/JUNOBASE.png'
      - 'data/labs/alabaster/juno_base_**'
      - '.github/workflows/romestead-retarget-sync-validation.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Download Godot 4.6.3
        shell: bash
        run: |
          curl --fail --location --retry 3 \
            "https://github.com/godotengine/godot-builds/releases/download/4.6.3-stable/Godot_v4.6.3-stable_linux.x86_64.zip" \
            --output /tmp/godot.zip >/dev/null 2>&1
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.6.3-stable_linux.x86_64

      - name: Import project and reject parser failures
        shell: bash
        run: |
          set -o pipefail
          timeout 300 /tmp/godot/Godot_v4.6.3-stable_linux.x86_64 \
            --headless --editor --path "$GITHUB_WORKSPACE" --quit-after 1 \
            2>&1 | tee /tmp/oathwake-import.log
          if grep -E "Parse Error|Failed to load script|Failed to create an autoload" /tmp/oathwake-import.log; then
            echo "Godot import reported a parser/autoload failure."
            exit 1
          fi

      - name: Validate procedural world contract
        shell: bash
        run: |
          /tmp/godot/Godot_v4.6.3-stable_linux.x86_64 \
            --headless --path "$GITHUB_WORKSPACE" \
            --script res://scripts/test/OathwakeProceduralWorldAugmentValidator.gd \
            2>&1 | tee /tmp/world-augment.log
          grep -F "OATHWAKE_WORLD_AUGMENT_OK" /tmp/world-augment.log

      - name: Validate JunoBase compact character sheet
        shell: bash
        run: |
          /tmp/godot/Godot_v4.6.3-stable_linux.x86_64 \
            --headless --path "$GITHUB_WORKSPACE" \
            --script res://scripts/test/AlabasterJunoBaseCompactAtlas.gd \
            2>&1 | tee /tmp/junobase-compact.log
          grep -F "ALABASTER_JUNO_BASE_COMPACT_OK" /tmp/junobase-compact.log
          test -s assets/sprites/characters/JUNOBASE.png

      - name: Validate JunoBase runtime integration
        shell: bash
        run: |
          /tmp/godot/Godot_v4.6.3-stable_linux.x86_64 \
            --headless --path "$GITHUB_WORKSPACE" \
            --script res://scripts/test/AlabasterJunoBaseIntegrationValidatorV3.gd \
            2>&1 | tee /tmp/junobase-runtime.log
          grep -F "ALABASTER_JUNO_BASE_INTEGRATION_OK" /tmp/junobase-runtime.log

      - name: Load stair/save scripts after import
        shell: bash
        run: |
          cat > /tmp/oathwake_sync_smoke.gd <<'EOF'
          extends SceneTree
          const PATHS := [
            "res://scripts/game/GameSession.gd",
            "res://scripts/systems/MultiFloorRuntimeBridge.gd",
            "res://scripts/systems/TibiaFloorVisibilityController.gd",
            "res://scripts/buildings/BuildingPlaceholderVisual.gd",
            "res://scripts/buildings/Building.gd",
            "res://scripts/buildings/Door.gd",
          ]
          func _init() -> void:
            for path in PATHS:
              if load(path) == null:
                push_error("SYNC_SMOKE_FAIL could not load %s" % path)
                quit(1)
                return
            print("SYNC_SMOKE_OK scripts=%d" % PATHS.size())
            quit(0)
          EOF
          /tmp/godot/Godot_v4.6.3-stable_linux.x86_64 \
            --headless --path "$GITHUB_WORKSPACE" --script /tmp/oathwake_sync_smoke.gd \
            2>&1 | tee /tmp/sync-smoke.log
          grep -F "SYNC_SMOKE_OK" /tmp/sync-smoke.log
