name: Nyra Clean Character Branch

on:
  push:
    branches:
      - fix/responsive-ui-slime-drop-glow-pickup
    paths:
      - ".github/workflows/nyra-character-snapshot.yml"

permissions:
  contents: write

jobs:
  transplant:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Collect game-ready character images
        run: |
          SOURCE="assets/sprites/characters/2D-Pixel-Art-Character-Template"
          TARGET="/tmp/2D-Pixel-Art-Character-Template"
          mkdir -p "$TARGET"
          rsync -a \
            --include='*/' \
            --include='*.png' \
            --include='*.png.import' \
            --exclude='*' \
            "$SOURCE/" "$TARGET/"
          rm -rf "$TARGET/Tilemap (Super Basic)"
          rm -rf "$TARGET/Climb (facing side of player)/old climb"
          find "$TARGET" -type d -empty -delete

      - name: Create clean branch from main
        run: |
          git config user.name "Nyra Automation"
          git config user.email "actions@users.noreply.github.com"
          git fetch origin main
          git switch -C feature/test-character-content origin/main
          DEST="assets/sprites/characters/2D-Pixel-Art-Character-Template"
          rm -rf "$DEST"
          mkdir -p "$DEST"
          rsync -a "/tmp/2D-Pixel-Art-Character-Template/" "$DEST/"
          git add "$DEST"
          git commit -m "Add expanded test character sprite pack"
          git push --force origin feature/test-character-content
