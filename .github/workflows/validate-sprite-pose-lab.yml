name: Validate Wyrdframe Studio

on:
  push:
    paths:
      - "tools/sprite_pose_lab/**"
      - "!tools/sprite_pose_lab/VALIDATION_RESULT.txt"
      - ".github/workflows/validate-sprite-pose-lab.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Godot 4.6.3
        shell: bash
        run: |
          curl --fail --location --retry 3 \
            "https://github.com/godotengine/godot-builds/releases/download/4.6.3-stable/Godot_v4.6.3-stable_linux.x86_64.zip" \
            --output godot.zip
          unzip -q godot.zip
          mv Godot_v4.6.3-stable_linux.x86_64 godot
          chmod +x godot

      - name: Build isolated validation project
        shell: bash
        run: |
          rm -rf /tmp/wyrdframe_check
          mkdir -p /tmp/wyrdframe_check/tools
          cp -R tools/sprite_pose_lab /tmp/wyrdframe_check/tools/
          cat > /tmp/wyrdframe_check/project.godot <<'EOF'
          [application]
          config/name="Wyrdframe Validation"
          run/main_scene="res://tools/sprite_pose_lab/scenes/WyrdframeStudio.tscn"

          [display]
          window/size/viewport_width=1500
          window/size/viewport_height=900
          window/size/window_width_override=1500
          window/size/window_height_override=900

          [rendering]
          renderer/rendering_method="gl_compatibility"
          renderer/rendering_method.mobile="gl_compatibility"
          EOF

      - name: Parse and smoke-test Wyrdframe
        id: godot_check
        shell: bash
        run: |
          set +e
          : > /tmp/wyrdframe_scripts.log
          SCRIPT_EXIT=0
          while IFS= read -r SCRIPT_PATH; do
            RESOURCE_PATH="res://${SCRIPT_PATH#/tmp/wyrdframe_check/}"
            echo "===== $RESOURCE_PATH =====" >> /tmp/wyrdframe_scripts.log
            ./godot --headless --path /tmp/wyrdframe_check --script "$RESOURCE_PATH" --check-only >> /tmp/wyrdframe_scripts.log 2>&1
            CODE=$?
            if [ "$CODE" -ne 0 ]; then
              SCRIPT_EXIT=1
            fi
          done < <(find /tmp/wyrdframe_check/tools/sprite_pose_lab/scripts -maxdepth 1 -name '*.gd' | sort)

          ./godot --headless --path /tmp/wyrdframe_check --editor --quit-after 12 > /tmp/wyrdframe_editor.log 2>&1
          EDITOR_EXIT=$?

          WYRD_FRAME_SMOKE_TEST=1 ./godot --headless --path /tmp/wyrdframe_check --quit-after 15 > /tmp/wyrdframe_runtime.log 2>&1
          RUNTIME_EXIT=$?
          set -e

          EXIT_CODE=0
          if [ "$SCRIPT_EXIT" -ne 0 ] || [ "$EDITOR_EXIT" -ne 0 ] || [ "$RUNTIME_EXIT" -ne 0 ]; then
            EXIT_CODE=1
          fi

          if cat /tmp/wyrdframe_scripts.log /tmp/wyrdframe_editor.log /tmp/wyrdframe_runtime.log | grep -E \
            "Parse Error|Compile Error|Failed to load script|SCRIPT ERROR|Cannot call method|blocked > 0|Invalid call|Invalid access" >/dev/null; then
            EXIT_CODE=1
          fi

          if ! grep -F "WYRD_FRAME_SMOKE_TEST_OK" /tmp/wyrdframe_runtime.log >/dev/null; then
            EXIT_CODE=1
          fi

          {
            echo "Wyrdframe Studio validation"
            echo "Godot: 4.6.3-stable"
            echo "Commit: $GITHUB_SHA"
            echo "Individual scripts exit: $SCRIPT_EXIT"
            echo "Editor exit: $EDITOR_EXIT"
            echo "Runtime exit: $RUNTIME_EXIT"
            echo "Exit code: $EXIT_CODE"
            echo
            echo "--- Individual script checks ---"
            tail -n 700 /tmp/wyrdframe_scripts.log
            echo
            echo "--- Editor log ---"
            tail -n 350 /tmp/wyrdframe_editor.log
            echo
            echo "--- Runtime smoke-test log ---"
            tail -n 350 /tmp/wyrdframe_runtime.log
          } > tools/sprite_pose_lab/VALIDATION_RESULT.txt

          echo "exit_code=$EXIT_CODE" >> "$GITHUB_OUTPUT"

      - name: Publish validation report
        if: always()
        shell: bash
        run: |
          git config user.name "Wyrdframe Validator"
          git config user.email "actions@users.noreply.github.com"
          git add tools/sprite_pose_lab/VALIDATION_RESULT.txt
          if ! git diff --cached --quiet; then
            git commit -m "chore: update Wyrdframe validation report [skip ci]"
            git push
          fi

      - name: Fail on parser, startup or interaction error
        if: steps.godot_check.outputs.exit_code != '0'
        shell: bash
        run: exit 1
