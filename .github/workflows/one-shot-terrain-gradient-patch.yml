name: One-shot Terrain Gradient Patch

on:
  push:
    branches:
      - feature/shadow-profiles-lut-lighting
    paths:
      - .github/terrain-gradient-patch-trigger

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feature/shadow-profiles-lut-lighting
          fetch-depth: 0

      - name: Replace only generated light texture
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('scenes/labs/TerrainAuthoringLab.tscn')
          text = path.read_text(encoding='utf-8')
          old = '''[ext_resource type="PackedScene" path="res://scenes/world/terrain/OathwakeGrassDirtTerrainLayer.tscn" id="1_8cul0"]

          [sub_resource type="Gradient" id="Gradient_dar8h"]
          colors = PackedColorArray(1, 1, 1, 1, 1, 1, 1, 0)

          [sub_resource type="GradientTexture2D" id="GradientTexture2D_4vw3g"]
          gradient = SubResource("Gradient_dar8h")
          width = 384
          height = 384
          fill = 1
          fill_from = Vector2(0.5, 0.5)
          fill_to = Vector2(1, 0.5)
          '''
          new = '''[ext_resource type="PackedScene" path="res://scenes/world/terrain/OathwakeGrassDirtTerrainLayer.tscn" id="1_8cul0"]
          [ext_resource type="Texture2D" path="res://resources/effects/textures/soft_light_radial.tres" id="2_light_texture"]
          '''
          if old not in text:
              raise SystemExit('Expected GradientTexture2D block was not found; refusing broad rewrite.')
          text = text.replace(old, new, 1)
          old_texture = 'texture = SubResource("GradientTexture2D_4vw3g")'
          new_texture = 'texture = ExtResource("2_light_texture")'
          if old_texture not in text:
              raise SystemExit('Expected PointLight2D texture assignment was not found.')
          text = text.replace(old_texture, new_texture, 1)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit exact patch
        shell: bash
        run: |
          if git diff --quiet -- scenes/labs/TerrainAuthoringLab.tscn; then
            echo "No terrain scene changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scenes/labs/TerrainAuthoringLab.tscn
          git commit -m "Replace terrain lab generated light texture"
          git push origin HEAD:feature/shadow-profiles-lut-lighting
