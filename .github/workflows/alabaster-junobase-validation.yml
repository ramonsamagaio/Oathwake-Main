name: Validate Alabaster JunoBase

on:
  push:
    branches:
      - fix/alabaster-final-retarget-polish
    paths:
      - 'scripts/test/AlabasterJunoBaseIntegrationValidator.gd'
      - 'scripts/test/AlabasterJunoBaseIntegrationValidatorV2.gd'
      - 'scripts/test/AlabasterJunoBaseIntegrationValidatorV3.gd'
      - 'scripts/test/AlabasterJunoBaseCompactAtlas.gd'
      - 'scripts/labs/alabaster/AlabasterJunoBaseProfile.gd'
      - 'scripts/labs/alabaster/AlabasterJunoBaseRig.gd'
      - 'scripts/labs/alabaster/AlabasterBoneStudioJunoBaseLiveTuning.gd'
      - 'scripts/labs/alabaster/AlabasterBoneStudioCompleteLiveTuning.gd'
      - 'scripts/labs/alabaster/AlabasterBoneStudioSharedProfiles.gd'
      - 'scripts/labs/alabaster/AlabasterBoneAnimationLibrary.gd'
      - 'scripts/labs/alabaster/AlabasterMechanicLabJunoBase.gd'
      - 'scenes/labs/alabaster/AlabasterMechanicLab.tscn'
      - 'scenes/labs/alabaster/AlabasterBoneStudio.tscn'
      - 'data/labs/alabaster/juno_base_sprite_audit.json'
      - 'data/labs/alabaster/juno_base_core_atlas.png'
      - 'data/labs/alabaster/juno_base_compact_atlas.png'
      - 'data/labs/alabaster/juno_base_compact_map.json'
      - '.github/workflows/alabaster-junobase-validation.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Download Godot 4.6.3
        shell: bash
        run: |
          curl --fail --location --retry 3 \
            "https://github.com/godotengine/godot-builds/releases/download/4.6.3-stable/Godot_v4.6.3-stable_linux.x86_64.zip" \
            --output godot.zip >/dev/null 2>&1
          unzip -q godot.zip
          mv Godot_v4.6.3-stable_linux.x86_64 godot
          chmod +x godot

      - name: Import project resources
        shell: bash
        run: |
          ./godot --headless --editor --path . --quit-after 1 > /tmp/junobase-import.log 2>&1 || {
            tail -400 /tmp/junobase-import.log
            exit 1
          }

      - name: Generate compact JunoBase atlas
        shell: bash
        run: |
          ./godot --headless --path . --script res://scripts/test/AlabasterJunoBaseCompactAtlas.gd > /tmp/junobase-compact.log 2>&1 || {
            tail -500 /tmp/junobase-compact.log
            exit 1
          }
          cat /tmp/junobase-compact.log | grep -F 'ALABASTER_JUNO_BASE_COMPACT_OK'

      - name: Persist generated compact atlas
        shell: bash
        run: |
          git add data/labs/alabaster/juno_base_compact_atlas.png data/labs/alabaster/juno_base_compact_map.json
          if git diff --cached --quiet; then
            echo "Compact atlas already deterministic and current."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "chore(alabaster): regenerate JunoBase compact atlas"
            git push
          fi

      - name: Validate JunoBase integration
        shell: bash
        run: |
          ./godot --headless --path . --script res://scripts/test/AlabasterJunoBaseIntegrationValidatorV3.gd > /tmp/junobase-validation.log 2>&1 || {
            tail -500 /tmp/junobase-validation.log
            exit 1
          }
          cat /tmp/junobase-validation.log | grep -E 'ALABASTER_(JUNO_BASE|LIVE_GREEN_MASK|BONE_STUDIO_FIGURE_PREVIEWS)'
          grep -F "ALABASTER_JUNO_BASE_INTEGRATION_OK" /tmp/junobase-validation.log
