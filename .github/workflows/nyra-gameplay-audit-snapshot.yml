name: Nyra Gameplay Audit Snapshot

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package repository
        run: |
          zip -qr oathwake-gameplay-audit.zip . \
            -x '.git/*' '.godot/*' 'oathwake-gameplay-audit.zip'
      - uses: actions/upload-artifact@v4
        with:
          name: oathwake-gameplay-audit
          path: oathwake-gameplay-audit.zip
          if-no-files-found: error
