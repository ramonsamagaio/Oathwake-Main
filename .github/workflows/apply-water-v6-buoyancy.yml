name: Apply Water V6 Continuous Buoyancy

on:
  push:
    branches:
      - tmp-pixel-water-build-20260811
    paths:
      - '.github/workflows/apply-water-v6-buoyancy.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp-pixel-water-build-20260811
          fetch-depth: 0

      - name: Apply continuous buoyancy patch
        run: python .tmp/pixel-water/tools/apply_v6_continuous_buoyancy.py

      - name: Commit V6 buoyancy pass
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .tmp/pixel-water/addons/pixel_water/buoyant_body.gd
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "fix: use continuous hydrostatic buoyancy for floaters"
          git push origin HEAD:tmp-pixel-water-build-20260811
