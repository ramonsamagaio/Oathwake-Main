name: Apply World PostFX Audio Hotfix

on:
  push:
    branches:
      - fix/world-postfx-drop-shadow-hit-audio

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/world-postfx-drop-shadow-hit-audio
          fetch-depth: 0

      - name: Apply exact repository changes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def read(path):
              return Path(path).read_text(encoding="utf-8")

          def write(path, text):
              Path(path).write_text(text, encoding="utf-8")

          def replace_once(path, old, new):
              text = read(path)
              if old not in text:
                  raise SystemExit(f"Expected block not found in {path}: {old[:120]!r}")
              text = text.replace(old, new, 1)
              write(path, text)

          # Post effects are global game layers, never children of the player.
          replace_once(
              "scenes/Player.tscn",
              '[ext_resource type="PackedScene" path="res://scenes/effects/ScreenEffects.tscn" id="3_screen_effects"]\n',
              '',
          )
          replace_once(
              "scenes/Player.tscn",
              '\n[node name="ScreenEffects" parent="." instance=ExtResource("3_screen_effects")]\n',
              '\n',
          )

          replace_once(
              "scenes/game/Game.tscn",
              '[ext_resource type="PackedScene" path="res://scenes/ui/HUDStatusUI.tscn" id="17_hud_status"]\n',
              '[ext_resource type="PackedScene" path="res://scenes/ui/HUDStatusUI.tscn" id="17_hud_status"]\n'
              '[ext_resource type="PackedScene" path="res://scenes/effects/MapFogOverlay.tscn" id="18_map_fog"]\n'
              '[ext_resource type="PackedScene" path="res://scenes/effects/ScreenEffects.tscn" id="19_screen_effects"]\n',
          )
          replace_once(
              "scenes/game/Game.tscn",
              '[node name="Player" parent="RuntimeEntities" unique_id=117263621 instance=ExtResource("3_player_scene")]\n\n[node name="UI"',
              '[node name="Player" parent="RuntimeEntities" unique_id=117263621 instance=ExtResource("3_player_scene")]\n\n'
              '[node name="WorldPostEffects" type="Node" parent="."]\n\n'
              '[node name="MapFogOverlay" parent="WorldPostEffects" instance=ExtResource("18_map_fog")]\n\n'
              '[node name="ScreenEffects" parent="WorldPostEffects" instance=ExtResource("19_screen_effects")]\n\n'
              '[node name="UI"',
          )

          # Map scenes no longer own screen-space fog, preventing duplicate overlays.
          replace_once(
              "scenes/maps/StartArea.tscn",
              '[ext_resource type="PackedScene" path="res://scenes/effects/MapFogOverlay.tscn" id="8_map_fog"]\n',
              '',
          )
          replace_once(
              "scenes/maps/StartArea.tscn",
              '\n[node name="MapFogOverlay" parent="." instance=ExtResource("8_map_fog")]\n',
              '',
          )

          # Keep the legacy Main scene consistent with the game scene.
          replace_once(
              "scenes/Main.tscn",
              '[ext_resource type="PackedScene" path="res://scenes/effects/MapFogOverlay.tscn" id="22_map_fog"]\n',
              '[ext_resource type="PackedScene" path="res://scenes/effects/MapFogOverlay.tscn" id="22_map_fog"]\n'
              '[ext_resource type="PackedScene" path="res://scenes/effects/ScreenEffects.tscn" id="23_screen_effects"]\n',
          )
          replace_once(
              "scenes/Main.tscn",
              '\n[node name="MapFogOverlay" parent="World" instance=ExtResource("22_map_fog")]\n',
              '',
          )
          replace_once(
              "scenes/Main.tscn",
              '[node name="Player" parent="World" unique_id=423538836 instance=ExtResource("1_player_scene")]\nposition = Vector2(0, 0)\n\n[node name="UI"',
              '[node name="Player" parent="World" unique_id=423538836 instance=ExtResource("1_player_scene")]\nposition = Vector2(0, 0)\n\n'
              '[node name="WorldPostEffects" type="Node" parent="."]\n\n'
              '[node name="MapFogOverlay" parent="WorldPostEffects" instance=ExtResource("22_map_fog")]\n\n'
              '[node name="ScreenEffects" parent="WorldPostEffects" instance=ExtResource("23_screen_effects")]\n\n'
              '[node name="UI"',
          )

          replace_once(
              "scenes/effects/MapFogOverlay.tscn",
              'layer = 2\n',
              'layer = 4\n',
          )

          write("scripts/effects/MapFogOverlay.gd", '''@tool
extends CanvasLayer

@export_category("Fog Overlay")
@export var effect_enabled := true:
\tset(value):
\t\teffect_enabled = value
\t\t_apply_settings()
@export_range(0.0, 1.0, 0.01) var density := 0.45:
\tset(value):
\t\tdensity = value
\t\t_apply_settings()
@export var speed := Vector2(0.018, 0.007):
\tset(value):
\t\tspeed = value
\t\t_apply_settings()
@export var fog_color := Color(0.62, 0.68, 0.72, 0.18):
\tset(value):
\t\tfog_color = value
\t\t_apply_settings()
@export_range(0.25, 12.0, 0.05) var fog_scale := 3.25:
\tset(value):
\t\tfog_scale = value
\t\t_apply_settings()
@export_range(0.0, 1.0, 0.01) var coverage := 0.48:
\tset(value):
\t\tcoverage = value
\t\t_apply_settings()
@export_range(0.01, 0.75, 0.01) var softness := 0.24:
\tset(value):
\t\tsoftness = value
\t\t_apply_settings()
@export_range(0.0, 1.0, 0.01) var detail_mix := 0.42:
\tset(value):
\t\tdetail_mix = value
\t\t_apply_settings()
@export_category("World Anchoring")
@export var anchor_to_world := true
@export_range(0.0, 2.0, 0.01) var world_anchor_strength := 1.0

@onready var fog_rect: ColorRect = $FogRect

var _last_camera_offset := Vector2(INF, INF)


func _ready() -> void:
\t_apply_settings()
\t_update_world_anchor(true)
\tset_process(true)


func _process(_delta: float) -> void:
\tif not effect_enabled or not anchor_to_world:
\t\treturn
\t_update_world_anchor(false)


func refresh_from_settings() -> void:
\t_apply_settings()
\t_update_world_anchor(true)


func _apply_settings() -> void:
\tvisible = effect_enabled
\tif not is_node_ready() or fog_rect == null:
\t\treturn
\tfog_rect.color = Color(0.0, 0.0, 0.0, 0.0)
\tvar shader_material := fog_rect.material as ShaderMaterial
\tif shader_material == null or shader_material.shader == null:
\t\tfog_rect.visible = false
\t\treturn
\tfog_rect.visible = effect_enabled
\tshader_material.set_shader_parameter("enabled", effect_enabled)
\tshader_material.set_shader_parameter("density", density)
\tshader_material.set_shader_parameter("speed", speed)
\tshader_material.set_shader_parameter("fog_color", fog_color)
\tshader_material.set_shader_parameter("fog_scale", fog_scale)
\tshader_material.set_shader_parameter("coverage", coverage)
\tshader_material.set_shader_parameter("softness", softness)
\tshader_material.set_shader_parameter("detail_mix", detail_mix)
\tshader_material.set_shader_parameter("world_anchor_strength", world_anchor_strength if anchor_to_world else 0.0)


func _update_world_anchor(force_update: bool) -> void:
\tif not is_node_ready() or fog_rect == null:
\t\treturn
\tvar shader_material := fog_rect.material as ShaderMaterial
\tif shader_material == null or shader_material.shader == null:
\t\treturn
\tif not anchor_to_world:
\t\tif force_update or _last_camera_offset != Vector2.ZERO:
\t\t\t_last_camera_offset = Vector2.ZERO
\t\t\tshader_material.set_shader_parameter("camera_offset", Vector2.ZERO)
\t\treturn
\tvar viewport := get_viewport()
\tif viewport == null:
\t\treturn
\tvar viewport_size := viewport.get_visible_rect().size
\tif viewport_size.x <= 0.0 or viewport_size.y <= 0.0:
\t\treturn
\tvar inverse_canvas := viewport.get_canvas_transform().affine_inverse()
\tvar world_top_left := inverse_canvas * Vector2.ZERO
\tvar world_bottom_right := inverse_canvas * viewport_size
\tvar world_span := (world_bottom_right - world_top_left).abs()
\tworld_span.x = maxf(world_span.x, 1.0)
\tworld_span.y = maxf(world_span.y, 1.0)
\tvar camera_offset := Vector2(world_top_left.x / world_span.x, world_top_left.y / world_span.y)
\tif not force_update and camera_offset.is_equal_approx(_last_camera_offset):
\t\treturn
\t_last_camera_offset = camera_offset
\tshader_material.set_shader_parameter("camera_offset", camera_offset)
\tshader_material.set_shader_parameter("world_anchor_strength", world_anchor_strength)
''')

          write("shaders/map_fog_overlay_2d.gdshader", '''// Procedural world-anchored adaptation of the requested CC0 2D Fog Overlay shader:
// https://godotshaders.com/shader/2d-fog-overlay-2/
shader_type canvas_item;
render_mode unshaded, blend_mix;

uniform bool enabled = true;
uniform float density : hint_range(0.0, 1.0, 0.01) = 0.45;
uniform vec2 speed = vec2(0.018, 0.007);
uniform vec4 fog_color : source_color = vec4(0.62, 0.68, 0.72, 0.18);
uniform float fog_scale : hint_range(0.25, 12.0, 0.05) = 3.25;
uniform float coverage : hint_range(0.0, 1.0, 0.01) = 0.48;
uniform float softness : hint_range(0.01, 0.75, 0.01) = 0.24;
uniform float detail_mix : hint_range(0.0, 1.0, 0.01) = 0.42;
uniform vec2 camera_offset = vec2(0.0);
uniform float world_anchor_strength : hint_range(0.0, 2.0, 0.01) = 1.0;

float fog_hash(vec2 point) {
\tvec3 point3 = fract(vec3(point.xyx) * 0.1031);
\tpoint3 += dot(point3, point3.yzx + 33.33);
\treturn fract((point3.x + point3.y) * point3.z);
}

float fog_value_noise(vec2 point) {
\tvec2 cell = floor(point);
\tvec2 fraction = fract(point);
\tvec2 smooth_fraction = fraction * fraction * (3.0 - 2.0 * fraction);
\tfloat bottom_left = fog_hash(cell);
\tfloat bottom_right = fog_hash(cell + vec2(1.0, 0.0));
\tfloat top_left = fog_hash(cell + vec2(0.0, 1.0));
\tfloat top_right = fog_hash(cell + vec2(1.0, 1.0));
\treturn mix(
\t\tmix(bottom_left, bottom_right, smooth_fraction.x),
\t\tmix(top_left, top_right, smooth_fraction.x),
\t\tsmooth_fraction.y
\t);
}

float fog_fbm(vec2 point) {
\tfloat result = 0.0;
\tresult += fog_value_noise(point) * 0.50;
\tresult += fog_value_noise(point * 2.03 + vec2(7.1, 3.7)) * 0.25;
\tresult += fog_value_noise(point * 4.07 + vec2(2.4, 9.2)) * 0.125;
\tresult += fog_value_noise(point * 8.11 + vec2(5.8, 1.6)) * 0.0625;
\treturn result / 0.9375;
}

void fragment() {
\tvec4 output_color = vec4(0.0);
\tif (enabled && density > 0.0 && fog_color.a > 0.0) {
\t\tvec2 drift = TIME * speed;
\t\tvec2 anchored_uv = UV + camera_offset * world_anchor_strength;
\t\tvec2 primary_position = anchored_uv * fog_scale + drift;
\t\tvec2 secondary_position = anchored_uv * (fog_scale * 1.73) - drift * 0.63 + vec2(4.7, 8.1);
\t\tfloat primary_noise = fog_fbm(primary_position);
\t\tfloat secondary_noise = fog_fbm(secondary_position);
\t\tfloat combined_noise = mix(primary_noise, secondary_noise, detail_mix);
\t\tfloat safe_softness = max(softness, 0.001);
\t\tfloat fog_amount = smoothstep(coverage - safe_softness, coverage + safe_softness, combined_noise);
\t\tfloat final_alpha = clamp(fog_color.a * density * fog_amount, 0.0, 0.32);
\t\toutput_color = vec4(fog_color.rgb, final_alpha);
\t}
\tCOLOR = output_color;
}
''')

          write("scripts/items/WorldItemEnhanced.gd", '''extends "res://scripts/items/WorldItem.gd"

@export var hover_enabled := true
@export var hover_amplitude: float = 2.2
@export var hover_speed: float = 1.35
@export var shadow_opacity: float = 0.38

var _hover_phase := 0.0
var _sprite_base_position := Vector2.ZERO
var _shadow_base_scale := Vector2.ONE
@onready var _shadow: Polygon2D = get_node_or_null("GroundShadow") as Polygon2D


func _ready() -> void:
\tsuper._ready()
\t_hover_phase = randf_range(0.0, TAU)
\t_sprite_base_position = sprite.position if sprite != null else Vector2.ZERO
\t_ensure_ground_shadow()


func _process(delta: float) -> void:
\tsuper._process(delta)
\tif collected:
\t\tif _shadow != null:
\t\t\t_shadow.visible = false
\t\treturn
\tif _shadow != null:
\t\t_shadow.visible = true
\tif not hover_enabled:
\t\treturn
\t_hover_phase += delta * hover_speed
\tvar wave := sin(_hover_phase)
\tif sprite != null:
\t\tsprite.position = _sprite_base_position + Vector2(0.0, wave * hover_amplitude)
\tif _shadow != null:
\t\tvar height_factor := (wave + 1.0) * 0.5
\t\t_shadow.scale = _shadow_base_scale * Vector2(1.0 - height_factor * 0.10, 1.0 - height_factor * 0.06)
\t\t_shadow.color.a = shadow_opacity * (1.0 - height_factor * 0.18)


func configure_ground_shadow(texture_size: Vector2, visual_scale: Vector2) -> void:
\t_ensure_ground_shadow()
\tif _shadow == null:
\t\treturn
\tvar visual_width := maxf(texture_size.x * absf(visual_scale.x), 1.0)
\tvar visual_height := maxf(texture_size.y * absf(visual_scale.y), 1.0)
\tvar target_width := clampf(visual_width * 0.34, 8.0, 18.0)
\tvar target_height := clampf(target_width * 0.26, 2.4, 4.8)
\t_shadow_base_scale = Vector2(target_width / 16.0, target_height / 6.0)
\t_shadow.scale = _shadow_base_scale
\t_shadow.position = Vector2(_sprite_base_position.x, _sprite_base_position.y + clampf(visual_height * 0.20, 6.0, 11.0))
\t_shadow.visible = not collected


func _ensure_ground_shadow() -> void:
\tif _shadow == null:
\t\t_shadow = Polygon2D.new()
\t\t_shadow.name = "GroundShadow"
\t\t_shadow.polygon = PackedVector2Array([
\t\t\tVector2(-8, 0), Vector2(-6, -2), Vector2(-2, -3), Vector2(2, -3),
\t\t\tVector2(6, -2), Vector2(8, 0), Vector2(6, 2), Vector2(2, 3),
\t\t\tVector2(-2, 3), Vector2(-6, 2),
\t\t])
\t\tadd_child(_shadow)
\t_shadow.show_behind_parent = true
\t_shadow.z_index = -1
\t_shadow.position = Vector2(0, 9)
\t_shadow.color = Color(0.012, 0.009, 0.016, shadow_opacity)
\t_shadow.modulate = Color.WHITE
\t_shadow.visible = true
''')

          # Synchronize the visible shadow to the actual drop sprite dimensions.
          replace_once(
              "scripts/items/WorldItemShaderSuite.gd",
              '\toutline_sprite.visible = bool(outline_settings.get("effect_enabled")) and texture_is_valid\n',
              '\toutline_sprite.visible = bool(outline_settings.get("effect_enabled")) and texture_is_valid\n'
              '\tif texture_is_valid and has_method("configure_ground_shadow"):\n'
              '\t\tcall("configure_ground_shadow", outline_sprite.texture.get_size(), sprite.scale)\n'
              '\telif _shadow != null:\n'
              '\t\t_shadow.visible = false\n',
