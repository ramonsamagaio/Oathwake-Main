          # Add a targeted validator and run it from the existing CI workflow.
          write("scripts/test/WorldPostFxAudioValidator.gd", '''extends SceneTree

var _failures: Array[String] = []


func _init() -> void:
\tcall_deferred("_run")


func _run() -> void:
\t_validate_game_layers()
\t_validate_world_item_shadow()
\t_validate_audio_routing()
\t_validate_fog_shader_contract()
\tif _failures.is_empty():
\t\tprint("WORLD_POSTFX_AUDIO_VALIDATION_PASS")
\t\tquit(0)
\t\treturn
\tfor failure in _failures:
\t\tpush_error("WORLD_POSTFX_AUDIO_VALIDATION_FAILURE: %s" % failure)
\tquit(1)


func _validate_game_layers() -> void:
\tvar packed := load("res://scenes/game/Game.tscn") as PackedScene
\tif packed == null:
\t\t_failures.append("Game scene could not be loaded.")
\t\treturn
\tvar game := packed.instantiate()
\troot.add_child(game)
\tvar player := game.get_node_or_null("RuntimeEntities/Player")
\tif player == null:
\t\t_failures.append("Game player is missing.")
\telif player.get_node_or_null("ScreenEffects") != null:
\t\t_failures.append("ScreenEffects is still parented to Player.")
\tvar fog := game.get_node_or_null("WorldPostEffects/MapFogOverlay") as CanvasLayer
\tvar glow := game.get_node_or_null("WorldPostEffects/ScreenEffects") as CanvasLayer
\tvar ui := game.get_node_or_null("UI") as CanvasLayer
\tif fog == null or fog.layer != 4:
\t\t_failures.append("Global fog layer must exist at layer 4.")
\tif glow == null or glow.layer != 5:
\t\t_failures.append("Global screen effects must exist at layer 5.")
\tif ui == null or ui.layer <= 5:
\t\t_failures.append("UI must remain above post effects.")
\tgame.queue_free()


func _validate_world_item_shadow() -> void:
\tvar packed := load("res://scenes/items/WorldItem.tscn") as PackedScene
\tif packed == null:
\t\t_failures.append("WorldItem scene could not be loaded.")
\t\treturn
\tvar item := packed.instantiate()
\troot.add_child(item)
\tvar shadow := item.get_node_or_null("GroundShadow") as Polygon2D
\tif shadow == null:
\t\t_failures.append("WorldItem GroundShadow is missing.")
\telif not shadow.show_behind_parent or shadow.z_index >= 0:
\t\t_failures.append("WorldItem GroundShadow must render behind the drop.")
\titem.queue_free()


func _validate_audio_routing() -> void:
\tvar manager := get_node_or_null("/root/SFXManager")
\tif manager == null:
\t\t_failures.append("SFXManager autoload is missing.")
\t\treturn
\tvar enemy := Node2D.new()
\troot.add_child(enemy)
\tenemy.add_to_group("enemy")
\tvar resource := Node2D.new()
\troot.add_child(resource)
\tresource.add_to_group("resource_node")
\tif str(manager.call("_resolve_hit_profile", enemy)) != "generic_enemy_hit":
\t\t_failures.append("Enemy hits do not route to generic_enemy_hit.")
\tif str(manager.call("_resolve_hit_profile", resource)) != "hit_resource":
\t\t_failures.append("Resource hits do not route to hit_resource.")
\tif not manager.has_profile("generic_enemy_hit"):
\t\t_failures.append("generic_enemy_hit profile is missing.")
\tenemy.queue_free()
\tresource.queue_free()


func _validate_fog_shader_contract() -> void:
\tvar shader := load("res://shaders/map_fog_overlay_2d.gdshader") as Shader
\tif shader == null:
\t\t_failures.append("Fog shader could not be loaded.")
\t\treturn
\tif not shader.code.contains("camera_offset") or not shader.code.contains("world_anchor_strength"):
\t\t_failures.append("Fog shader is not world anchored.")
''')

          workflow_path = ".github/workflows/godot-scene-effects-validation.yml"
          workflow = read(workflow_path)
          path_anchor = '      - "scripts/audio/**"\n'
          if '      - "scripts/player/**"\n' not in workflow:
              workflow = workflow.replace(
                  path_anchor,
                  path_anchor + '      - "scripts/player/**"\n      - "scenes/game/**"\n      - "scenes/Player.tscn"\n      - "scenes/maps/**"\n      - "data/sfx_profiles.json"\n',
                  1,
              )
          step_anchor = '      - name: Open the real game scene briefly\n'
          validator_step = '''      - name: Validate world post effects and hit audio routing
        shell: bash
        run: |
          set -o pipefail
          xvfb-run -a ./godot \\
            --path . \\
            --rendering-method gl_compatibility \\
            --display-driver x11 \\
            --script res://scripts/test/WorldPostFxAudioValidator.gd \\
            --verbose 2>&1 | tee world-postfx-audio-validation.log

'''
          if validator_step not in workflow:
              workflow = workflow.replace(step_anchor, validator_step + step_anchor, 1)
          upload_anchor = '            game-scene-smoke-test.log\n'
          if '            world-postfx-audio-validation.log\n' not in workflow:
              workflow = workflow.replace(upload_anchor, upload_anchor + '            world-postfx-audio-validation.log\n', 1)
          write(workflow_path, workflow)
          PY

          rm -f .github/workflows/apply-world-postfx-audio-hotfix.yml

      - name: Commit applied hotfix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix world post effects, drop shadows and hit audio"
          git push origin HEAD:fix/world-postfx-drop-shadow-hit-audio
