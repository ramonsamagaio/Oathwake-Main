name: Validate Procedural Creatures

on:
  push:
    paths:
      - "scripts/creatures/**"
      - "scripts/labs/alabaster/**"
      - "scenes/labs/ProceduralCreatureLab.tscn"
      - "scenes/labs/alabaster/AlabasterBoneStudio.tscn"
      - "scripts/test/ProceduralCreatureValidator.gd"
      - "scripts/test/AlabasterBoneBridgeValidator.gd"
      - "scripts/test/AlabasterCardinalWalkValidator.gd"
      - "scripts/test/AlabasterWalkContinuityDiagnostic.gd"
      - "scripts/test/AlabasterRetargetFidelityDiagnostic.gd"
      - ".github/workflows/validate-procedural-creatures.yml"
  pull_request:
    paths:
      - "scripts/creatures/**"
      - "scripts/labs/alabaster/**"
      - "scenes/labs/ProceduralCreatureLab.tscn"
      - "scenes/labs/alabaster/AlabasterBoneStudio.tscn"
      - "scripts/test/ProceduralCreatureValidator.gd"
      - "scripts/test/AlabasterBoneBridgeValidator.gd"
      - "scripts/test/AlabasterCardinalWalkValidator.gd"
      - "scripts/test/AlabasterWalkContinuityDiagnostic.gd"
      - "scripts/test/AlabasterRetargetFidelityDiagnostic.gd"
      - ".github/workflows/validate-procedural-creatures.yml"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Godot 4.6.3
        shell: bash
        run: |
          curl --fail --location --retry 3 \
            "https://github.com/godotengine/godot-builds/releases/download/4.6.3-stable/Godot_v4.6.3-stable_linux.x86_64.zip" \
            --output godot.zip
          unzip -q godot.zip
          mv Godot_v4.6.3-stable_linux.x86_64 godot
          chmod +x godot

      - name: Import project and catch parser failures
        shell: bash
        run: |
          set -o pipefail
          ./godot --headless --editor --path . --quit-after 30 --verbose 2>&1 | tee procedural-creature-import.log
          if grep -E "Parse Error|Compile Error|SCRIPT ERROR|Failed to load script|Error parsing|Invalid call|Invalid access" procedural-creature-import.log; then
            echo "Godot import reported a parser/runtime failure."
            exit 1
          fi

      - name: Run procedural creature contract smoke test
        shell: bash
        run: |
          set -o pipefail
          ./godot --headless --path . --script res://scripts/test/ProceduralCreatureValidator.gd --verbose 2>&1 | tee procedural-creature-validator.log
          if grep -E "PROCEDURAL_CREATURE_VALIDATION_FAILURE|Parse Error|Compile Error|SCRIPT ERROR|Failed to load script|Invalid call|Invalid access" procedural-creature-validator.log; then
            exit 1
          fi
          grep -F "PROCEDURAL_CREATURE_VALIDATION_OK" procedural-creature-validator.log

      - name: Run Alabaster Bone Bridge scene smoke test
        shell: bash
        run: |
          set -o pipefail
          ./godot --headless --path . --script res://scripts/test/AlabasterBoneBridgeValidator.gd --verbose 2>&1 | tee alabaster-bone-bridge-validator.log
          if grep -E "ALABASTER_BONE_BRIDGE_VALIDATION_FAILURE|Parse Error|Compile Error|SCRIPT ERROR|Failed to load script|Invalid call|Invalid access" alabaster-bone-bridge-validator.log; then
            exit 1
          fi
          grep -F "ALABASTER_BONE_BRIDGE_VALIDATION_OK" alabaster-bone-bridge-validator.log

      - name: Run Alabaster cardinal walk stance regression
        shell: bash
        run: |
          set -o pipefail
          ./godot --headless --path . --script res://scripts/test/AlabasterCardinalWalkValidator.gd --verbose 2>&1 | tee alabaster-cardinal-walk-validator.log
          if grep -E "ALABASTER_CARDINAL_WALK_VALIDATION_FAILURE|Parse Error|Compile Error|SCRIPT ERROR|Failed to load script|Invalid call|Invalid access" alabaster-cardinal-walk-validator.log; then
            exit 1
          fi
          grep -F "ALABASTER_CARDINAL_WALK_VALIDATION_OK" alabaster-cardinal-walk-validator.log

      - name: Diagnose Alabaster Walking lower-limb continuity
        shell: bash
        run: |
          set -o pipefail
          ./godot --headless --path . --script res://scripts/test/AlabasterWalkContinuityDiagnostic.gd --verbose 2>&1 | tee alabaster-walk-continuity.log
          if grep -E "ALABASTER_WALK_CONTINUITY_DIAGNOSTIC_FAILURE|Parse Error|Compile Error|SCRIPT ERROR|Failed to load script|Invalid call|Invalid access" alabaster-walk-continuity.log; then
            exit 1
          fi
          grep -F "ALABASTER_WALK_CONTINUITY_DIAGNOSTIC_OK" alabaster-walk-continuity.log

      - name: Diagnose Alabaster retarget transform fidelity
        shell: bash
        run: |
          set -o pipefail
          ./godot --headless --path . --script res://scripts/test/AlabasterRetargetFidelityDiagnostic.gd --verbose 2>&1 | tee alabaster-retarget-fidelity.log
          if grep -E "ALABASTER_RETARGET_FIDELITY_DIAGNOSTIC_FAILURE|Parse Error|Compile Error|SCRIPT ERROR|Failed to load script|Invalid call|Invalid access" alabaster-retarget-fidelity.log; then
            exit 1
          fi
          grep -F "ALABASTER_RETARGET_FIDELITY_DIAGNOSTIC_OK" alabaster-retarget-fidelity.log
