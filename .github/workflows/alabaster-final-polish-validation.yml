name: Validate Alabaster Final Retarget Polish

on:
  push:
    paths:
      - "scripts/labs/alabaster/AlabasterRigRuntimeLayerGuard.gd"
      - "scripts/systems/bones/BonesSystem.gd"
      - "scripts/labs/alabaster/AlabasterMechanicLabProfiles.gd"
      - "scripts/monsters/OathwakeMonsterRig.gd"
      - "scripts/test/AlabasterLayerHierarchyValidator.gd"
      - "scripts/test/AlabasterMechanicGolemValidator.gd"
      - "scripts/test/AlabasterMechanicValidator.gd"
      - "scripts/test/AlabasterMonsterTemplateValidator.gd"
      - ".github/workflows/alabaster-final-polish-validation.yml"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Godot 4.6.3
        shell: bash
        run: |
          curl --fail --location --retry 3 \
            "https://github.com/godotengine/godot-builds/releases/download/4.6.3-stable/Godot_v4.6.3-stable_linux.x86_64.zip" \
            --output godot.zip >/dev/null 2>&1
          unzip -q godot.zip
          mv Godot_v4.6.3-stable_linux.x86_64 godot
          chmod +x godot

      - name: Import project resources
        shell: bash
        run: |
          ./godot --headless --editor --path . --quit-after 1 > alabaster-final-import.log 2>&1 || {
            tail -180 alabaster-final-import.log
            exit 1
          }

      - name: Validate Mechanic Lab baseline
        shell: bash
        run: |
          ./godot --headless --path . --script res://scripts/test/AlabasterMechanicValidator.gd > mechanic.log 2>&1 || {
            tail -180 mechanic.log
            exit 1
          }
          grep -F "ALABASTER_MECHANIC_VALIDATION_OK" mechanic.log

      - name: Validate Claude golems in Mechanic Lab
        shell: bash
        run: |
          ./godot --headless --path . --script res://scripts/test/AlabasterMechanicGolemValidator.gd > mechanic-golems.log 2>&1 || {
            tail -220 mechanic-golems.log
            exit 1
          }
          grep -E "ALABASTER_MECHANIC_GOLEM(S|_PROFILE)_OK" mechanic-golems.log

      - name: Validate final sprite hierarchy
        shell: bash
        run: |
          ./godot --headless --path . --script res://scripts/test/AlabasterLayerHierarchyValidator.gd > layer-hierarchy.log 2>&1 || {
            tail -240 layer-hierarchy.log
            exit 1
          }
          grep -F "ALABASTER_LAYER_HIERARCHY_OK" layer-hierarchy.log

      - name: Validate monster template
        shell: bash
        run: |
          ./godot --headless --path . --script res://scripts/test/AlabasterMonsterTemplateValidator.gd > monster-template.log 2>&1 || {
            tail -220 monster-template.log
            exit 1
          }
          grep -E "ALABASTER_MONSTER.*OK" monster-template.log | tail -20
