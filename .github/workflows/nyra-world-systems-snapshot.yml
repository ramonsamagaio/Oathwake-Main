name: Nyra World Systems Snapshot

on:
  push:
    branches:
      - feature/world-depth-shadows-hit-attacks
    paths:
      - ".github/workflows/nyra-world-systems-snapshot.yml"

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package repository
        run: |
          zip -qr oathwake-world-systems-snapshot.zip . \
            -x '.git/*' '.godot/*' 'oathwake-world-systems-snapshot.zip'
      - uses: actions/upload-artifact@v4
        with:
          name: oathwake-world-systems-snapshot
          path: oathwake-world-systems-snapshot.zip
          if-no-files-found: error
