name: Cleanup Effect Preview Hotfix

on:
  push:
    branches:
      - hotfix/effect-preview-type-cache
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hotfix/effect-preview-type-cache
          fetch-depth: 0
      - name: Remove temporary hotfix scaffolding
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/godot-scene-effects-validation.yml')
          text = path.read_text(encoding='utf-8')
          text = text.replace('            tools/content_editor/ContentEditorShaderSuite.gd\n', '')
          path.write_text(text, encoding='utf-8')
          PY
          git rm -f \
            .github/workflows/export-content-editor-hotfix-source.yml \
            .github/workflows/apply-effect-preview-type-hotfix.yml \
            .github/workflows/cleanup-effect-preview-hotfix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/godot-scene-effects-validation.yml
          git commit -m "chore: remove hotfix scaffolding"
          git push origin HEAD:hotfix/effect-preview-type-cache
