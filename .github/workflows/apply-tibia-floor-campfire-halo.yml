name: Apply Tibia Floor Campfire Halo Feature

on:
  pull_request:
    branches: [main]
    paths:
      - ".feature/tibia-floor-campfire-halo-bundle.tar.gz"
      - ".github/workflows/apply-tibia-floor-campfire-halo.yml"

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Apply feature bundle
        shell: bash
        run: |
          set -euo pipefail
          tar -xzf .feature/tibia-floor-campfire-halo-bundle.tar.gz -C .
          rm -rf .feature
          rm -f .github/workflows/apply-tibia-floor-campfire-halo.yml
          rm -f tmp/.keep-tibia-branch
          rmdir tmp 2>/dev/null || true
          git config user.name "Oathwake Automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "feat: add Tibia-style floor visibility animated campfire flame and wide player halo"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
