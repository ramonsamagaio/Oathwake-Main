name: Apply Water V5 Surface Stability

on:
  push:
    branches:
      - tmp-pixel-water-build-20260811
    paths:
      - '.github/workflows/apply-water-v5-surface.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp-pixel-water-build-20260811
          fetch-depth: 0

      - name: Apply V5 surface stability patch
        run: python .tmp/pixel-water/tools/apply_v5_surface_patch.py

      - name: Commit V5 surface pass
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .tmp/pixel-water/addons/pixel_water/pixel_water_world.gd \
                  .tmp/pixel-water/addons/pixel_water/buoyant_body.gd \
                  .tmp/pixel-water/addons/pixel_water/water_bucket.gd
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "fix: calm surface coupling and conserve splash water"
            git push origin HEAD:tmp-pixel-water-build-20260811
          fi
