name: Register Test Character Content

on:
  push:
    branches:
      - feature/test-character-content
    paths:
      - ".github/workflows/register-test-character-content.yml"

permissions:
  contents: write

jobs:
  register:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Register sprites animations character and active selection
        shell: python
        run: |
          import json
          import struct
          from pathlib import Path

          ROOT = Path("assets/sprites/characters/2D-Pixel-Art-Character-Template")

          sheets = [
              ("test_template_air_spin", "Air Spin/player air spin 48x48.png", 48, 48, "Air Spin"),
              ("test_template_climb_back", "Climb (facing back of player)/player climb-back 48x48.png", 48, 48, "Climb Back"),
              ("test_template_climb_side", "Climb (facing side of player)/Player Side-Climb 48x48.png", 48, 48, "Climb Side"),
              ("test_template_crouch_idle", "Crouch-Idle/Player Crouch-Idle 48x48.png", 48, 48, "Crouch Idle"),
              ("test_template_crouch_walk", "Crouch-Walk/player crouch-walk 48x48.png", 48, 48, "Crouch Walk"),
              ("test_template_dash", "Dash/dash.png", 48, 48, "Dash"),
              ("test_template_death", "Death/Player Death 64x64.png", 48, 48, "Death"),
              ("test_template_hurt", "Hurt-Damaged/Player Hurt 48x48.png", 48, 48, "Hurt"),
              ("test_template_idle", "Idle/Player Idle 48x48.png", 48, 48, "Idle"),
              ("test_template_jump", "Jump/player new jump 48x48.png", 48, 48, "Jump"),
              ("test_template_katana_attack_sheathe", "Katana Attack-Sheathe/player katana attack-sheathe 80x64.png", 80, 64, "Katana Attack Sheathe"),
              ("test_template_katana_continuous_attack", "Katana Continuous Attack/player katana continuous attack 80x64.png", 80, 64, "Katana Continuous Attack"),
              ("test_template_katana_run", "Katana Run/player katana run 48x48.png", 48, 48, "Katana Run"),
              ("test_template_katana_walk", "Katana walk/katana walk.png", 48, 48, "Katana Walk"),
              ("test_template_land", "Land/player land 48x48.png", 48, 48, "Land"),
              ("test_template_ledge_climb", "Ledge Grab-Climb/player ledge climb 48x48.png", 48, 48, "Ledge Grab Climb"),
              ("test_template_pull", "Pull/Player Pull 48x48.png", 48, 48, "Pull"),
              ("test_template_punch", "Punch/Player Punch 64x64.png", 64, 64, "Punch"),
              ("test_template_punch_cross", "Punch Cross/Player Punch Cross 64x64.png", 64, 64, "Punch Cross"),
              ("test_template_punch_jab", "Punch Jab/Player Jab 48x48.png", 48, 48, "Punch Jab"),
              ("test_template_push", "Push/player push 48x48.png", 48, 48, "Push"),
              ("test_template_push_idle", "PushPull (idle state)/player push idle 48x48.png", 48, 48, "Push Pull Idle"),
              ("test_template_roll", "Roll/Player Roll 48x48.png", 48, 48, "Roll"),
              ("test_template_run", "Run/player run 48x48.png", 48, 48, "Run"),
              ("test_template_run_aim", "Shooting (running and aiming)/Player Running Aiming 48x48.png", 48, 48, "Running Aim"),
              ("test_template_run_shoot", "Shooting (running and aiming)/Player Running Shooting 48x48.png", 48, 48, "Running Shoot"),
              ("test_template_shoot_two_handed", "Shooting (two-handed)/player shoot 2H 48x48.png", 48, 48, "Shoot Two Handed"),
              ("test_template_slide", "Slide/Player Slide 48x48.png", 48, 48, "Slide"),
              ("test_template_sword_attack", "Sword Attack/player sword atk 64x64.png", 64, 64, "Sword Attack"),
              ("test_template_sword_idle", "Sword Idle/Player Sword Idle 48x48.png", 48, 48, "Sword Idle"),
              ("test_template_sword_run", "Sword Run/Player Sword Run 48x48.png", 48, 48, "Sword Run"),
              ("test_template_sword_stab", "Sword Stab/Player Sword Stab 96x48.png", 96, 48, "Sword Stab"),
              ("test_template_walk", "Walk/PlayerWalk 48x48.png", 48, 48, "Walk"),
              ("test_template_wall_land_left", "Wall Land/Player Wall Land (left) 48x48.png", 48, 48, "Wall Land Left"),
              ("test_template_wall_land_right", "Wall Land/player wall land 48x48.png", 48, 48, "Wall Land Right"),
              ("test_template_wall_slide_left", "Wall Slide/player wall slide (left) 48x48.png", 48, 48, "Wall Slide Left"),
              ("test_template_wall_slide_right", "Wall Slide/player wall slide 48x48.png", 48, 48, "Wall Slide Right"),
          ]

          def load_json(path):
              return json.loads(Path(path).read_text(encoding="utf-8"))

          def save_json(path, data):
              Path(path).write_text(json.dumps(data, ensure_ascii=False, indent="\t") + "\n", encoding="utf-8")

          sprites = load_json("data/sprites.json")
          sheet_frame_counts = {}
          for sprite_id, relative_path, frame_w, frame_h, display_name in sheets:
              path = ROOT / relative_path
              if not path.exists():
                  raise SystemExit(f"Missing character sheet: {path}")
              header = path.read_bytes()[:24]
              width, height = struct.unpack(">II", header[16:24])
              if width % frame_w or height % frame_h:
                  raise SystemExit(f"Invalid frame grid for {path}: {width}x{height} / {frame_w}x{frame_h}")
              columns = width // frame_w
              rows = height // frame_h
              total = columns * rows
              sheet_frame_counts[sprite_id] = total
              sprites[sprite_id] = {
                  "category": "character",
                  "columns": columns,
                  "display_name": f"Test Template • {display_name}",
                  "frame_height": frame_h,
                  "frame_size": {"h": frame_h, "w": frame_w},
                  "frame_width": frame_w,
                  "region": {"h": frame_h, "w": frame_w, "x": 0, "y": 0},
                  "region_enabled": False,
                  "rows": rows,
                  "tags": ["test-character", "side-view", "multi-sheet"],
                  "texture_path": "res://" + path.as_posix(),
                  "total_frames": total,
                  "type": "sprite_sheet",
              }
          save_json("data/sprites.json", dict(sorted(sprites.items())))

          def anim(sheet_id, fps=10, loop=True):
              count = sheet_frame_counts[sheet_id]
              return {
                  "fps": fps,
                  "frame_count": count,
                  "frames": list(range(count)),
                  "loop": loop,
                  "sprite_sheet_id": sheet_id,
              }

          animations = {}
          for direction in ("down", "up", "left", "right"):
              animations[f"idle_{direction}"] = anim("test_template_idle", 8, True)
              animations[f"walk_{direction}"] = anim("test_template_walk", 10, True)
              animations[f"run_{direction}"] = anim("test_template_run", 12, True)
              animations[f"attack_{direction}"] = anim("test_template_sword_attack", 12, False)
              animations[f"dash_{direction}"] = anim("test_template_dash", 16, False)
              animations[f"interact_{direction}"] = anim("test_template_push", 10, False)

          extra_animation_sheets = {
              "air_spin": ("test_template_air_spin", 14, False),
              "climb_back": ("test_template_climb_back", 8, True),
              "climb_side": ("test_template_climb_side", 8, True),
              "crouch_idle": ("test_template_crouch_idle", 8, True),
              "crouch_walk": ("test_template_crouch_walk", 10, True),
              "death": ("test_template_death", 10, False),
              "hurt": ("test_template_hurt", 12, False),
              "jump": ("test_template_jump", 12, False),
              "katana_attack_sheathe": ("test_template_katana_attack_sheathe", 14, False),
              "katana_continuous_attack": ("test_template_katana_continuous_attack", 14, False),
              "katana_run": ("test_template_katana_run", 12, True),
              "katana_walk": ("test_template_katana_walk", 10, True),
              "land": ("test_template_land", 14, False),
              "ledge_climb": ("test_template_ledge_climb", 10, False),
              "pull": ("test_template_pull", 10, True),
              "punch": ("test_template_punch", 14, False),
              "punch_cross": ("test_template_punch_cross", 14, False),
              "punch_jab": ("test_template_punch_jab", 14, False),
              "push": ("test_template_push", 10, True),
              "push_idle": ("test_template_push_idle", 8, True),
              "roll": ("test_template_roll", 14, False),
              "run_aim": ("test_template_run_aim", 12, True),
              "run_shoot": ("test_template_run_shoot", 12, True),
              "shoot_two_handed": ("test_template_shoot_two_handed", 14, False),
              "slide": ("test_template_slide", 14, False),
              "sword_attack": ("test_template_sword_attack", 12, False),
              "sword_idle": ("test_template_sword_idle", 8, True),
              "sword_run": ("test_template_sword_run", 12, True),
              "sword_stab": ("test_template_sword_stab", 14, False),
              "wall_land_left": ("test_template_wall_land_left", 12, False),
              "wall_land_right": ("test_template_wall_land_right", 12, False),
              "wall_slide_left": ("test_template_wall_slide_left", 8, True),
              "wall_slide_right": ("test_template_wall_slide_right", 8, True),
          }
          for animation_name, (sheet_id, fps, loop) in extra_animation_sheets.items():
              animations[animation_name] = anim(sheet_id, fps, loop)

          animation_sets = load_json("data/animation_sets.json")
          animation_sets["test_template_character"] = {
              "anchor": {"x": 24, "y": 42},
              "animations": dict(sorted(animations.items())),
              "direction_mode": "4dir",
              "display_name": "Test Template Character Animations",
              "sprite_sheet_id": "test_template_idle",
          }
          save_json("data/animation_sets.json", dict(sorted(animation_sets.items())))

          characters = load_json("data/characters.json")
          source_character = dict(characters.get("player", {}))
          source_character.update({
              "animation_set_id": "test_template_character",
              "display_name": "Test Template Character",
              "orientation_mode": "side_view",
              "sprite_sheet_id": "test_template_idle",
          })
          characters["test_template_player"] = source_character
          save_json("data/characters.json", dict(sorted(characters.items())))

          tuning = load_json("data/player_tuning.json")
          tuning.setdefault("default", {})["character_id"] = "test_template_player"
          save_json("data/player_tuning.json", tuning)

      - name: Commit Content Editor records
        run: |
          git config user.name "Nyra Automation"
          git config user.email "actions@users.noreply.github.com"
          git add data/sprites.json data/animation_sets.json data/characters.json data/player_tuning.json
          git commit -m "Register test character in Content Editor data"
          git push
