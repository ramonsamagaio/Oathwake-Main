name: Nyra Apply World Systems

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/nyra/world-systems.ready"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/world-depth-shadows-hit-attacks
      - name: Assemble and apply reviewed patch
        run: |
          cat .github/nyra/world-systems.part* > /tmp/world-systems.patch
          git apply --check /tmp/world-systems.patch
          git apply /tmp/world-systems.patch
          rm -f .github/nyra/world-systems.part*
          rm -f .github/nyra/world-systems.ready
          rm -f .github/workflows/nyra-apply-world-systems.yml
      - name: Commit changes
        run: |
          git config user.name "Nyra Automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Fix world depth shadows hit motion and attack variety"
          git push origin HEAD:feature/world-depth-shadows-hit-attacks
